{
  id: "imports", title: "Other people's work", minutes: 9,
  why: "Almost nothing you want to do is unwritten. The standard library ships with Python and covers an enormous amount of it — knowing it exists is most of the benefit.",
  known: [
    "`name = value` attaches a name. `print(X)` writes X out.",
    "`[a, b, c]` is a list; `{key: value}` is a dictionary.",
    "`def name(args):` makes a function; `return` hands a value back.",
    "`f\"text {name}\"` drops a value into the text.",
    "`with open(name, mode) as f:` opens a file for the indented block."
  ],
  blocks: [
    {t:"rule", x:"`import random` makes a module available under its own name; you then reach into it with a dot: `random.choice(...)`. It goes at the top of the file."},
    {t:"rule", x:"`from datetime import date` takes one specific thing out of a module so you can use it unqualified: `date.today()`. Both forms are normal; the first keeps it obvious where a name came from."},
    {t:"code", src:'import random\n\nbirds = ["heron", "wren", "crow", "kite"]\nprint(random.choice(birds))\nprint(random.sample(birds, 2))',
      note:"Run it more than once — the output changes. random.sample picks that many, without repeats."},
    {t:"p", x:"A short list of standard-library modules worth knowing exist, so that you recognise the name when you meet it:"},
    {t:"table", head:["module","for"], rows:[
      ["random",   "choosing, shuffling, sampling."],
      ["json",     "turning lists and dictionaries into text and back — how you save structured data to a file."],
      ["datetime", "dates and times, and the difference between two of them."],
      ["pathlib",  "file paths, done properly. Path(\"notes\") / \"a.txt\"."],
      ["os",       "the surrounding machine — environment variables, directory listings."],
      ["re",       "finding patterns in text. Powerful, and worth its own afternoon."],
      ["collections", "Counter, defaultdict — better shapes for counting and grouping."],
      ["statistics", "mean, median and friends, without writing them yourself."],
      ["csv",      "reading and writing spreadsheet-shaped files."],
      ["textwrap", "wrapping and indenting blocks of text."]
    ]},
    {t:"rule", x:"`json.dumps(x)` turns a list or dictionary into text. `json.loads(s)` turns that text back into the list or dictionary. This pair is how almost everything gets saved, sent, and loaded again — including the progress this page keeps for you."},
    {t:"code", src:'import json\n\nrecord = {"name": "wren", "home": "hedge", "seen": ["tuesday", "friday"]}\nas_text = json.dumps(record)\nprint(as_text)\nprint(type(as_text))\n\nback = json.loads(as_text)\nprint(back["home"])',
      note:"Out to text, and back again unharmed. Read the NAMES table: as_text is a str, back is a dict."},
    {t:"p", x:"Modules that do not ship with Python — requests, pandas, numpy and the rest — are installed with `pip install name` at a terminal, not from inside the program. That step is outside this page, and it is the next thing to learn after this file."},
    {t:"ex", id:"m1",
      prompt:"Import json. Build a dictionary attached to `note` with \"tool\" giving \"chisel\" and \"kept\" giving True. Turn it into text, print that text, then load it back and print just the value for \"tool\". Expected output:\n\n{\"tool\": \"chisel\", \"kept\": true}\nchisel",
      starter:"import json\n\n",
      check:{ out:'{"tool": "chisel", "kept": true}\nchisel', require:[["json\\.dumps","use json.dumps"],["json\\.loads","use json.loads"]] },
      hints:["json.dumps(note) hands back text — attach a name to it and print that.",
             "Note that Python's True becomes json's lowercase true. That is correct, not a mistake.",
             'text = json.dumps(note) / print(text) / back = json.loads(text) / print(back["tool"])'],
      solution:'import json\n\nnote = {"tool": "chisel", "kept": True}\ntext = json.dumps(note)\nprint(text)\nback = json.loads(text)\nprint(back["tool"])'}
  ],
  cards: [
    {q:"What is the difference between `import random` and `from random import choice`?", a:"The first makes the module available and you reach in with random.choice(...). The second lifts one name out so you write choice(...) directly. The first keeps the origin visible."},
    {q:"What do json.dumps and json.loads do?", a:"dumps turns a list or dictionary into text; loads turns that text back into the list or dictionary. This pair is how structured data gets saved and reloaded."},
    {q:"How do you get a module that does not ship with Python?", a:"pip install name, run at a terminal — not from inside the program."}
  ]
},

/* ── 16 ────────────────────────────────────────────────────── */
{
  id: "classes", title: "Making a kind of your own", minutes: 14,
  why: "You have been using objects since the first lesson - every dot you have typed was one. A class is how you make a new kind of thing, for when some data and some behaviour belong together and keep travelling together.",
  known: [
    "`def name(parameters):` makes a function; the indented body runs only when it is called. `return X` hands X back to the caller.",
    "Names created inside a function stop existing when it finishes.",
    "`{key: value}` is a dictionary; `d[key]` looks one up and `d[key] = v` sets one.",
    "`[a, b, c]` is a list; `things.append(x)` adds to the end.",
    "`f\"text {name}\"` drops a value into text; `f\"{name!r}\"` drops in its repr, with the quotes.",
    "`type(X)` tells you what kind of thing X is.",
    "`name = value` attaches a name to a value."
  ],
  blocks: [
    {t:"p", x:"Every one of these has already appeared in this file: `\"heron\".upper()`, `birds.append(\"wren\")`, `homes.items()`, `f.read()`, `line.strip()`. In each one, the thing before the dot is an **object**, and the dot means *ask this thing to do something it already knows how to do*. You have been working with objects the whole time; nobody made a fuss about it because there was nothing to make a fuss about."},
    {t:"rule", x:"Every object has a **class** — the kind of thing it is. That is what `type(X)` has been reporting all along, and it has been saying the word since the lesson on kinds."},
    {t:"code", src:'print(type("heron"))\nprint(type(["heron"]))\nprint(type({"a": 1}))', note:"The word class, in the output, for three things you already use daily."},
    {t:"rule", x:"`class Name:` starts a new kind, with an indented block of `def`s underneath. Class names are written in CapitalisedWords — the one place in Python where that convention applies."},
    {t:"rule", x:"`def __init__(self, ...):` runs automatically whenever you make one of these. Its whole job is to attach the starting values. The two underscores on each side mark it as a name Python itself calls; you write it, you never call it."},
    {t:"rule", x:"**`self` is the object itself**, handed in automatically as the first parameter of every method. You write it in the `def` and you never pass it at the call: `heron.describe()` quietly becomes `describe(heron)`. That is the whole trick and there is nothing else hidden in it."},
    {t:"rule", x:"`self.something = value` attaches a value **to the object**, where it survives after the method finishes — unlike an ordinary name inside a function, which vanishes. That difference is the entire reason classes exist."},
    {t:"code", src:'class Bird:\n    def __init__(self, name, home):\n        self.name = name\n        self.home = home\n\n    def describe(self):\n        return f"the {self.name} lives in the {self.home}"\n\nheron = Bird("heron", "reeds")\nwren = Bird("wren", "hedge")\n\nprint(heron.describe())\nprint(wren.describe())\nprint(heron.name)',
      note:"Two Birds, made from one class. Run it, then read the NAMES table underneath - and notice how useless it is."},
    {t:"warn", x:"That is the problem the next rule fixes. Without being told otherwise, an object prints as `<Bird object>` — it tells you its kind and absolutely nothing else. In the names table, in a print, in an error message: nothing."},
    {t:"rule", x:"`def __repr__(self):` returns the text that Python shows when it needs to display the object. **Write one for every class you make, before you write anything else.** It is not an advanced topic and it is not decoration; it is the difference between being able to look at your own program and not."},
    {t:"code", src:'class Bird:\n    def __init__(self, name, home):\n        self.name = name\n        self.home = home\n\n    def __repr__(self):\n        return f"Bird({self.name!r}, {self.home!r})"\n\nheron = Bird("heron", "reeds")\nwren = Bird("wren", "hedge")\n\nprint(heron)\nprint([heron, wren])',
      note:"The same class with one method added. Run it and read the NAMES table again - it now tells you everything."},
    {t:"note", x:"This matters more here than in most places. Everything this file recommends — the names table under every run, `print(f\"{x=}\")` when you are lost, reading a value rather than holding it — runs through `repr()`. A class without `__repr__` is a hole in exactly that machinery: the one place where looking stops working. Define it first."},
    {t:"rule", x:"Each object made from a class is separate. Changing one's attachments does not touch another's, even though they came from the same class and share the same methods."},
    {t:"code", src:'class Bird:\n    def __init__(self, name, home):\n        self.name = name\n        self.home = home\n\n    def __repr__(self):\n        return f"Bird({self.name!r}, {self.home!r})"\n\nheron = Bird("heron", "reeds")\nwren = Bird("wren", "hedge")\n\nheron.home = "the riverbank"\n\nprint(heron)\nprint(wren)',
      note:"One changed, one untouched."},
    {t:"rule", x:"A method can change the object it belongs to: `self.things.append(x)` inside a method modifies that object's own list, and the change is still there on the next call."},
    {t:"code", src:'class Basket:\n    def __init__(self):\n        self.things = []\n\n    def add(self, thing):\n        self.things.append(thing)\n\n    def __repr__(self):\n        return f"Basket({self.things!r})"\n\nbasket = Basket()\nbasket.add("chisel")\nbasket.add("rasp")\nprint(basket)',
      note:"`__init__` takes no extra parameters here - the starting state is simply an empty list. Two calls to add, both remembered."},
    {t:"p", x:"Now the part that is a judgement rather than a rule, and the part most material leaves out."},
    {t:"note", x:"**A class is not the default and not a mark of seriousness.** It earns its place when data and behaviour travel together *and* you have more than one of the thing. If you only have data, a dictionary is usually simpler and better. If you only have behaviour, a function is. An enormous amount of excellent Python contains no classes its author wrote — and code that wraps every function in a class it did not need is a well-known way to make a small program hard to read."},
    {t:"table", head:["reach for","when"], rows:[
      ["a dictionary", "you have data and nothing else. Keys can be anything, added and removed freely, no behaviour attached."],
      ["a function",   "you have behaviour and nothing else — something goes in, something comes back."],
      ["a class",      "the two are stuck together: several of a thing, each carrying its own state, each knowing how to do things with it."]
    ]},
    {t:"p", x:"One more thing exists that this lesson is deliberately not teaching. A class can be built **on top of** another one, taking its methods and changing some — that is called inheritance, and it is the usual next topic. It is also over-used more than almost anything else in the language: most problems people reach for it to solve are better handled by one object simply holding another. Learn it when you meet it in code you have to read, not before."},
    {t:"ex", id:"cl1",
      prompt:"Write a class `Tool` whose `__init__` takes a name and what it is used for, and stores both. Give it a method `describe` that **returns** a sentence. Make one with \"chisel\" and \"cutting\", and print its description. Expected output:\n\na chisel is for cutting",
      starter:"",
      check:{ out:"a chisel is for cutting",
              require:[["class\\s+Tool\\s*:", "define a class called Tool"],
                       ["def\\s+__init__\\s*\\(\\s*self", "give it an __init__ taking self first"],
                       ["def\\s+describe\\s*\\(\\s*self", "give it a describe method taking self"],
                       ["return\\b", "describe should return the sentence, not print it"]] },
      hints:["Inside __init__, attach the values with self.name = name and self.used_for = used_for.",
             "describe takes only self, and builds the sentence from self.name and self.used_for.",
             'return f"a {self.name} is for {self.used_for}" - then print(Tool("chisel", "cutting").describe()) or attach a name to the Tool first.'],
      solution:'class Tool:\n    def __init__(self, name, used_for):\n        self.name = name\n        self.used_for = used_for\n\n    def describe(self):\n        return f"a {self.name} is for {self.used_for}"\n\nchisel = Tool("chisel", "cutting")\nprint(chisel.describe())'},
    {t:"ex", id:"cl2",
      prompt:"Write a class `Tool` whose `__init__` takes just a name, and give it a `__repr__` so that printing the object directly produces exactly:\n\nTool('chisel')\n\nNote the quotes around chisel in the expected output - `!r` inside an f-string gives you those.",
      starter:"",
      check:{ out:"Tool('chisel')",
              require:[["def\\s+__repr__\\s*\\(\\s*self", "define __repr__ taking self"],
                       ["return\\b", "__repr__ must return the text, not print it"]] },
      hints:["__repr__ takes only self and returns a piece of text.",
             'f"Tool({self.name!r})" gives Tool(\'chisel\') - the !r is what adds the quotes.',
             "Then just print(Tool(\"chisel\")) - printing the object calls __repr__ for you."],
      solution:'class Tool:\n    def __init__(self, name):\n        self.name = name\n\n    def __repr__(self):\n        return f"Tool({self.name!r})"\n\nprint(Tool("chisel"))'},
    {t:"ex", id:"cl3",
      prompt:"Write a class `Basket` that starts with an empty list, has an `add` method that puts something into it, and a `__repr__`. Make one, add \"chisel\" and then \"rasp\", and print it. Expected output:\n\nBasket(['chisel', 'rasp'])",
      starter:"",
      check:{ out:"Basket(['chisel', 'rasp'])",
              require:[["class\\s+Basket\\s*:", "define a class called Basket"],
                       ["def\\s+add\\s*\\(\\s*self", "give it an add method taking self first"],
                       ["append", "add should append to the object's own list"],
                       ["def\\s+__repr__\\s*\\(\\s*self", "give it a __repr__"]] },
      hints:["__init__ takes only self here, and sets self.things = [].",
             "add takes self and the thing, and does self.things.append(thing).",
             'return f"Basket({self.things!r})" in __repr__.'],
      solution:'class Basket:\n    def __init__(self):\n        self.things = []\n\n    def add(self, thing):\n        self.things.append(thing)\n\n    def __repr__(self):\n        return f"Basket({self.things!r})"\n\nbasket = Basket()\nbasket.add("chisel")\nbasket.add("rasp")\nprint(basket)'}
  ],
  cards: [
    {q:"What is `self` ?", a:"The object itself, handed in automatically as the first parameter of every method. You write it in the def and never pass it at the call: heron.describe() becomes describe(heron)."},
    {q:"What does `__init__` do, and do you ever call it yourself?", a:"It runs automatically when an object is made, to attach the starting values. You write it; you never call it."},
    {q:"Why write `__repr__` for every class you make?", a:"Without it an object displays as <Bird object> and tells you nothing - in the names table, in a print, in an error. It is what makes looking at your own program possible, so define it first, not last."},
    {q:"What is the difference between `self.x = 1` inside a method and `x = 1` inside a plain function?", a:"self.x attaches the value to the object, where it survives after the method finishes. A plain name inside a function stops existing when the function returns."},
    {q:"When is a dictionary the better choice than a class?", a:"When you have data and nothing else. A class earns its place when data and behaviour travel together and you have several of the thing."},
    {q:"What is inheritance, and why is it not taught here?", a:"Building one class on top of another, taking its methods and changing some. It is over-used - most cases are better served by one object simply holding another. Learn it when you meet it in code you must read."}
  ]
}
];

/* ══════════════════════════════════════════════════════════════
   STORAGE — the ledger proper

   Everything is kept in localStorage under one key, as JSON.
   Progress, every line of code you have written in every cell,
   the input boxes, your notes, the review schedule, and a
   timestamped log of every run you have ever made.

   The log is the point. SDAM means the episodic layer does not
   come back on its own; so it gets written down instead. You are
   never asked "do you remember doing this" — you can open the
   ledger and read it.
   ══════════════════════════════════════════════════════════════ */

const KEY = "ledger.python.v1";
const MAX_LOG = 500;

function blank() {
  return {
    v: 1,
    created: Date.now(),
    lastSeen: Date.now(),
    place: { view: "home", lesson: null },
    code: {},      /* cellKey -> source you last had in the editor  */
    inputs: {},    /* cellKey -> the pretend typed input            */
    done: {},      /* exerciseKey -> timestamp it first passed      */
    seen: {},      /* lessonId -> timestamp first opened            */
    log: [],       /* every run, newest last                        */
    notes: "",
    cards: {}      /* cardKey -> {box, due, right, wrong}           */
  };
}

let S = blank();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) S = Object.assign(blank(), JSON.parse(raw));
  } catch (e) { /* corrupt or unavailable — carry on with a blank one */ }
}
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const write = () => {
    S.lastSeen = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { /* quota or private mode — nothing to do but keep running */ }
  };
  if (now) write(); else saveTimer = setTimeout(write, 350);
}
load();

const DAY = 86400000;
const lessonById = (id) => LESSONS.find(l => l.id === id);
const lessonIndex = (id) => LESSONS.findIndex(l => l.id === id);

function exercisesOf(l) { return l.blocks.filter(b => b.t === "ex"); }
function exKey(l, b) { return l.id + ":" + b.id; }

function lessonProgress(l) {
  const ex = exercisesOf(l);
  const done = ex.filter(b => S.done[exKey(l, b)]).length;
  return { done, total: ex.length, seen: !!S.seen[l.id], complete: ex.length > 0 && done === ex.length };
}

/* ══════════════════════════════════════════════════════════════
   REVIEW SCHEDULE — Leitner boxes, no scoring, no streaks

   Two buttons only: knew it / did not. "Did not" is not a
   penalty, it just puts the card back in the near queue. Nothing
   is ever lost by answering honestly, and there is no number
   going down.
   ══════════════════════════════════════════════════════════════ */

const BOX_DAYS = [1, 2, 4, 9, 21];

function allCards() {
  const out = [];
  for (const l of LESSONS) {
    if (!S.seen[l.id]) continue;          /* never review something not met */
    (l.cards || []).forEach((c, i) => out.push({ key: l.id + "#" + i, lesson: l, ...c }));
  }
  return out;
}
function cardState(key) { return S.cards[key] || { box: 0, due: 0, right: 0, wrong: 0 }; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => cardState(c.key).due <= now);
}
function gradeCard(key, knew) {
  const st = cardState(key);
  if (knew) {
    st.right++;
    st.box = Math.min(st.box + 1, BOX_DAYS.length - 1);
    st.due = Date.now() + BOX_DAYS[st.box] * DAY;
  } else {
    st.wrong++;
    st.box = 0;
    st.due = Date.now();                  /* comes round again this session */
  }
  S.cards[key] = st;
  save();
}

/* ══════════════════════════════════════════════════════════════
   PYTHON — real CPython, compiled to WebAssembly, in the tab
   ══════════════════════════════════════════════════════════════ */

const PYODIDE_VERSIONS = ["0.27.7", "0.26.4", "0.25.1"];
let py = null;
let pyPhase = "loading";                  /* loading | ready | failed */
let pyWaiters = [];

const statEl = document.getElementById("pystat");
function setStat(text, cls) {
  statEl.textContent = text;
  statEl.className = cls || "";
}

const HARNESS = [
'import sys, io, json, builtins, traceback, linecache, re, types',
'',
'def __ledger_trim(text):',
'    # keep only frames from the learner\'s own code - the machinery',
'    # that runs it is not part of what went wrong.',
'    keep, out = True, []',
'    for line in text.split("\\n"):',
'        body = line.lstrip(" ")',
'        indent = len(line) - len(body)',
'        if indent == 2 and body.startswith("File \\""):',
'            keep = "File \\"your code\\"" in line',
'        elif indent < 2:',
'            keep = True',
'        if keep:',
'            out.append(line)',
'    return "\\n".join(out)',
'',
'def __ledger_run(src, input_text):',
'    ns = {"__name__": "__main__"}',
'    buf = io.StringIO()',
'    queue = [ln for ln in input_text.split("\\n")] if input_text else []',
'    while queue and queue[-1] == "":',
'        queue.pop()',
'    def fake_input(prompt=""):',
'        buf.write(str(prompt))',
'        if not queue:',
'            raise EOFError("ran out of input lines - add another line to the input box below the editor")',
'        line = queue.pop(0)',
'        buf.write(line + "\\n")',
'        return line',
'    old_out, old_err, old_in = sys.stdout, sys.stderr, builtins.input',
'    sys.stdout = buf',
'    sys.stderr = buf',
'    builtins.input = fake_input',
'    err = None',
'    linecache.cache["your code"] = (len(src), None, src.splitlines(True), "your code")',
'    try:',
'        exec(compile(src, "your code", "exec"), ns)',
'    except BaseException as e:',
'        tb = e.__traceback__',
'        if tb is not None:',
'            tb = tb.tb_next',
'        err = __ledger_trim("".join(traceback.format_exception(type(e), e, tb)))',
'    finally:',
'        sys.stdout, sys.stderr, builtins.input = old_out, old_err, old_in',
'    names = []',
'    for k, v in ns.items():',
'        if k.startswith("__"):',
'            continue',
'        try:',
'            if isinstance(v, types.ModuleType):',
'                r = "<module " + repr(getattr(v, "__name__", "?")) + ">"',
'            else:',
'                r = re.sub(r" at 0x[0-9a-fA-F]+", "", repr(v))',
'        except BaseException:',
'            r = "<no repr>"',
'        if len(r) > 240:',
'            r = r[:240] + " ..."',
'        names.append({"n": k, "t": type(v).__name__, "v": r})',
'    return json.dumps({"out": buf.getvalue(), "err": err, "names": names})',
''
].join("\n");

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("could not load " + src));
    document.head.appendChild(s);
  });
}

async function bootPython() {
  for (const v of PYODIDE_VERSIONS) {
    const base = "https://cdn.jsdelivr.net/pyodide/v" + v + "/full/";
    try {
      setStat("python: fetching…");
      await loadScript(base + "pyodide.js");
      setStat("python: starting…");
      py = await loadPyodide({ indexURL: base });
      py.runPython(HARNESS);
      pyPhase = "ready";
      setStat("python " + v + " ready", "ready");
      pyWaiters.forEach(f => f()); pyWaiters = [];
      return;
    } catch (e) {
      console.warn("pyodide " + v + " failed:", e);
      if (typeof loadPyodide !== "undefined") { try { delete window.loadPyodide; } catch (_) {} }
    }
  }
  pyPhase = "failed";
  setStat("python unavailable — click", "fail");
  statEl.onclick = () => alert(
    "Python could not be downloaded.\n\n" +
    "This page fetches CPython (compiled to WebAssembly) from a CDN the first time it runs, " +
    "so it needs a working internet connection on first load. After that the browser caches it.\n\n" +
    "Everything else still works offline: the lessons, your saved code, the ledger, the notes " +
    "and the review cards. Only the Run button needs the download."
  );
  pyWaiters.forEach(f => f()); pyWaiters = [];
}
function pythonReady() {
  if (pyPhase !== "loading") return Promise.resolve(pyPhase === "ready");
  return new Promise(res => pyWaiters.push(() => res(pyPhase === "ready")));
}

async function runPython(src, inputText) {
  const ok = await pythonReady();
  if (!ok) return { out: "", err: "Python is not loaded. This page downloads it on first run and needs a connection to do that.", names: [] };
  try {
    const raw = py.globals.get("__ledger_run")(src, inputText || "");
    return JSON.parse(raw);
  } catch (e) {
    return { out: "", err: String(e), names: [] };
  }
}

/* ══════════════════════════════════════════════════════════════
   RENDERING
   ══════════════════════════════════════════════════════════════ */

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function md(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, '<code class="inl">$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return h.replace(/\n/g, "<br>");
}

/* Times, said in words. A date is a fact; "three days ago" is the
   fact you actually wanted. */
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
function clock(d) {
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function when(ts) {
  if (!ts) return "never";
  const d = new Date(ts), gap = Date.now() - ts;
  if (gap < 60000) return "just now";
  if (gap < 3600000) { const m = Math.round(gap / 60000); return m === 1 ? "a minute ago" : m + " minutes ago"; }
  if (gap < 21600000) { const h = Math.round(gap / 3600000); return h === 1 ? "an hour ago" : h + " hours ago"; }
  const today = new Date(); today.setHours(0,0,0,0);
  const then = new Date(ts); then.setHours(0,0,0,0);
  const days = Math.round((today - then) / DAY);
  if (days === 0) return "earlier today, at " + clock(d);
  if (days === 1) return "yesterday, at " + clock(d);
  if (days < 7) return "last " + DAYS[d.getDay()] + ", at " + clock(d);
  return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + ", at " + clock(d);
}

function norm(s) {
  return String(s == null ? "" : s).replace(/\r/g, "").split("\n")
    .map(x => x.replace(/[ \t]+$/, "")).join("\n").replace(/^\n+/, "").replace(/\n+$/, "");
}

/* The structure readout: your own indentation, drawn out, so the
   block shape is something you read rather than something you hold. */
function structureHTML(src) {
  const lines = src.split("\n");
  const w = String(lines.length).length;
  let out = "";
  lines.forEach((raw, i) => {
    const n = String(i + 1).padStart(w, " ");
    if (raw.trim() === "") { out += '<span class="ln">' + n + "</span>\n"; return; }
    const lead = raw.match(/^[ \t]*/)[0];
    const body = raw.slice(lead.length);
    let flag = "";
    if (lead.indexOf("\t") >= 0) flag = "  ← tab character, use four spaces";
    else if (lead.length % 4 !== 0) flag = "  ← " + lead.length + " spaces, not a multiple of four";
    const depth = Math.floor(lead.replace(/\t/g, "    ").length / 4);
    const guide = "│   ".repeat(depth);
    out += '<span class="ln">' + n + "</span> " +
           '<span class="gd">' + guide + "</span>" +
           '<span class="src">' + esc(body) + "</span>" +
           (flag ? '<span class="bad">' + esc(flag) + "</span>" : "") + "\n";
  });
  return out;
}

/* ── the exercise checker ──────────────────────────────────── */
function judge(block, res, src) {
  const c = block.check || {};
  if (res.err) return { ok: false, why: "Your code stopped with an error. Read the **last line** of it above — that is the sentence that says what went wrong. Everything above it only says where." };
  if (c.forbid) for (const [re, msg] of c.forbid)
    if (new RegExp(re).test(src)) return { ok: false, why: "For this one, " + msg + "." };
  if (c.require) for (const [re, msg] of c.require)
    if (!new RegExp(re).test(src)) return { ok: false, why: "This exercise wants you to " + msg + " — and it is not there yet." };
  const got = norm(res.out);
  if (c.nonempty && got === "") return { ok: false, why: "Nothing was printed. The output is empty." };
  if (c.contains) for (const s of c.contains)
    if (got.indexOf(s) < 0) return { ok: false, why: "The output does not contain `" + s + "` yet.", got };
  if (c.out != null) {
    const want = norm(c.out);
    if (got !== want) {
      const gl = got.split("\n"), wl = want.split("\n");
      let detail = "wanted:\n" + want + "\n\ngot:\n" + (got === "" ? "(nothing)" : got);
      if (gl.length !== wl.length)
        detail = "wanted " + wl.length + " line" + (wl.length === 1 ? "" : "s") +
                 ", got " + gl.length + ".\n\n" + detail;
      else {
        for (let i = 0; i < wl.length; i++) if (wl[i] !== gl[i]) {
          detail = "line " + (i + 1) + " is not right yet.\n\n" + detail; break;
        }
      }
      return { ok: false, why: "The output is not quite it.", detail };
    }
  }
  return { ok: true };
}

/* ── code cells ────────────────────────────────────────────── */

function cellHTML(lesson, block, idx) {
  const key = lesson.id + ":" + (block.id || ("c" + idx));
  const isEx = block.t === "ex";
  const passed = isEx && !!S.done[key];
  const src = S.code[key] != null ? S.code[key] : (isEx ? (block.starter || "") : block.src);
  const inputs = S.inputs[key] != null ? S.inputs[key] : (block.inputs || "");
  const wantsInput = /input\s*\(/.test(src) || block.inputs != null || (block.check && block.check.inputs != null);
  return (
    '<div class="cell ' + (isEx ? "exercise" : "") + '" data-key="' + key + '" data-lesson="' + lesson.id + '" data-block="' + idx + '">' +
      '<div class="cellhead">' +
        '<span class="ctag ' + (isEx ? (passed ? "ok" : "ex") : "") + '">' +
          (isEx ? (passed ? "exercise · done" : "exercise") : "example") + "</span>" +
        (isEx ? '<button class="btn ghost act-hint">hint</button>' +
                '<button class="btn ghost act-sol">show one answer</button>' : "") +
        '<button class="btn ghost act-reset">reset</button>' +
      "</div>" +
      (isEx ? '<div class="prompt">' + md(block.prompt) + "</div>" : "") +
      '<textarea class="editor" spellcheck="false" rows="' +
        Math.max(3, src.split("\n").length + 1) + '">' + esc(src) + "</textarea>" +
      '<div class="inputrow" ' + (wantsInput ? "" : 'style="display:none"') + ">" +
        '<div class="inputlbl">input lines — what the imaginary person types, one per line</div>' +
        '<textarea class="inputs" spellcheck="false" rows="2">' + esc(inputs) + "</textarea>" +
      "</div>" +
      '<div class="cellbar">' +
        '<button class="btn run act-run">run</button>' +
        (block.note ? '<span style="font-size:12.5px;color:var(--dim)">' + md(block.note) + "</span>" : "") +
        '<span class="spacer"></span>' +
        '<button class="btn ghost act-struct">structure</button>' +
      "</div>" +
      '<div class="out" style="display:none"></div>' +
      '<div class="verdictslot"></div>' +
      '<div class="hintslot"></div>' +
    "</div>"
  );
}

function wireCell(el) {
  const key = el.dataset.key;
  const lesson = lessonById(el.dataset.lesson);
  const block = lesson.blocks[Number(el.dataset.block)];
  const ed = $(".editor", el), inp = $(".inputs", el);
  const outEl = $(".out", el), vSlot = $(".verdictslot", el), hSlot = $(".hintslot", el);
  let hintLevel = 0, structOpen = false, lastRes = null;

  const autosize = () => { ed.style.height = "auto"; ed.style.height = (ed.scrollHeight + 2) + "px"; };
  setTimeout(autosize, 0);

  ed.addEventListener("input", () => {
    S.code[key] = ed.value; save(); autosize();
    const row = $(".inputrow", el);
    if (/input\s*\(/.test(ed.value)) row.style.display = "";
  });
  inp.addEventListener("input", () => { S.inputs[key] = inp.value; save(); });

  /* Editor manners: Tab is four spaces, Enter keeps your indent and
     adds a level after a colon. Python's whitespace is syntax; the
     editor should not make you count it. */
  ed.addEventListener("keydown", (e) => {
    const v = ed.value, a = ed.selectionStart, b = ed.selectionEnd;
    if (e.key === "Tab") {
      e.preventDefault();
      if (e.shiftKey) {
        const ls = v.lastIndexOf("\n", a - 1) + 1;
        const cut = v.slice(ls, ls + 4) === "    " ? 4 : (v.slice(ls, ls + 1) === " " ? 1 : 0);
        if (cut) {
          ed.value = v.slice(0, ls) + v.slice(ls + cut);
          ed.selectionStart = ed.selectionEnd = Math.max(ls, a - cut);
        }
      } else {
        ed.value = v.slice(0, a) + "    " + v.slice(b);
        ed.selectionStart = ed.selectionEnd = a + 4;
      }
      ed.dispatchEvent(new Event("input"));
    } else if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      const ls = v.lastIndexOf("\n", a - 1) + 1;
      const line = v.slice(ls, a);
      let pad = (line.match(/^[ \t]*/) || [""])[0];
      if (/:\s*$/.test(line)) pad += "    ";
      const ins = "\n" + pad;
      ed.value = v.slice(0, a) + ins + v.slice(b);
      ed.selectionStart = ed.selectionEnd = a + ins.length;
      ed.dispatchEvent(new Event("input"));
    } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); doRun();
    }
  });

  function outSection(label, inner) {
    return '<div class="outsec"><div class="outlbl">' + label + "</div>" + inner + "</div>";
  }

  function paint() {
    if (!lastRes) return;
    const r = lastRes;
    let h = "";
    const out = r.out || "";
    h += outSection("output",
      out === "" ? '<pre class="stream empty">(nothing was printed)</pre>'
                 : '<pre class="stream">' + esc(out) + "</pre>");
    if (r.err) h += outSection("error — read the last line first",
      '<pre class="stream err">' + esc(r.err.replace(/\n+$/, "")) + "</pre>");
    if (r.names && r.names.length) {
      h += outSection("names — everything that exists right now",
        '<table class="vars">' + r.names.map(n =>
          '<tr><td class="vn">' + esc(n.n) + '</td><td class="vt">' + esc(n.t) +
          '</td><td class="vv">' + esc(n.v) + "</td></tr>").join("") + "</table>");
    }
    if (structOpen) h += outSection("structure — your indentation, drawn out",
      '<pre class="struct">' + structureHTML(ed.value) + "</pre>");
    outEl.innerHTML = h;
    outEl.style.display = "";
  }

  async function doRun() {
    const btn = $(".act-run", el);
    btn.disabled = true; btn.textContent = "running…";
    const src = ed.value;
    const res = await runPython(src, inp.value);
    lastRes = res; paint();
    btn.disabled = false; btn.textContent = "run";

    let verdict = null;
    if (block.t === "ex") {
      verdict = judge(block, res, src);
      const head = $(".ctag", el);
      if (verdict.ok) {
        if (!S.done[key]) S.done[key] = Date.now();
        head.textContent = "exercise · done"; head.className = "ctag ok";
        vSlot.innerHTML = '<div class="verdict pass"><span class="vh">That is it.</span>' +
          "The output matches. Written down in the ledger, with the code you used." + "</div>";
        renderNav();
      } else {
        vSlot.innerHTML = '<div class="verdict fail"><span class="vh">Not yet — and that is ordinary.</span>' +
          md(verdict.why) + (verdict.detail ? "<pre>" + esc(verdict.detail) + "</pre>" : "") +
          '<div style="margin-top:8px;font-size:13px;opacity:0.8">Nothing is lost by getting it wrong. ' +
          "The hint button is above, and so is a worked answer if you would rather read one.</div></div>";
      }
    } else { vSlot.innerHTML = ""; }

    S.log.push({
      ts: Date.now(), key, lesson: lesson.id, title: lesson.title,
      kind: block.t, src, out: (res.out || "").slice(0, 4000),
      err: res.err ? res.err.slice(0, 2000) : null,
      ok: verdict ? verdict.ok : null
    });
    if (S.log.length > MAX_LOG) S.log = S.log.slice(-MAX_LOG);
    save(true);
  }

  $(".act-run", el).onclick = doRun;
  $(".act-struct", el).onclick = () => {
    structOpen = !structOpen;
    if (!lastRes) lastRes = { out: "", err: null, names: [] };
    paint();
  };
  $(".act-reset", el).onclick = () => {
    ed.value = block.t === "ex" ? (block.starter || "") : block.src;
    S.code[key] = ed.value; save(); autosize();
    outEl.style.display = "none"; vSlot.innerHTML = ""; hSlot.innerHTML = "";
    lastRes = null; hintLevel = 0;
  };
  const hb = $(".act-hint", el);
  if (hb) hb.onclick = () => {
    const hints = block.hints || [];
    if (hintLevel >= hints.length) {
      hSlot.innerHTML = '<div class="hintbox">That is every hint there is. ' +
        "<b>show one answer</b> above will write out a version that works — reading it is a legitimate way to learn this, not a shortcut.</div>";
      return;
    }
    hintLevel++;
    hSlot.innerHTML = '<div class="hintbox">' +
      hints.slice(0, hintLevel).map((h, i) => "<b>hint " + (i + 1) + ".</b> " + md(h)).join("<br><br>") +
      "</div>";
  };
  const sb = $(".act-sol", el);
  if (sb) sb.onclick = () => {
    ed.value = block.solution; S.code[key] = ed.value; save(); autosize();
    hSlot.innerHTML = '<div class="hintbox">One answer that works, put into the editor. ' +
      "There are others. Run it, change a piece, run it again and see what breaks — " +
      "that is worth more than having written it unaided.</div>";
  };
}

/* ══════════════════════════════════════════════════════════════
   VIEWS
   ══════════════════════════════════════════════════════════════ */

const view = document.getElementById("view");

function go(v, arg) {
  S.place.view = v;
  if (v === "lesson") { S.place.lesson = arg; if (!S.seen[arg]) S.seen[arg] = Date.now(); }
  save(true);
  render();
  window.scrollTo(0, 0);
  $("#rail").classList.remove("open");
}

function renderNav() {
  const due = dueCards().length;
  let h = '<div class="railsec">lessons</div>';
  LESSONS.forEach((l, i) => {
    const p = lessonProgress(l);
    const cls = "navitem" + (S.place.view === "lesson" && S.place.lesson === l.id ? " on" : "") +
                (p.complete ? " done" : (p.seen ? " started" : ""));
    h += '<button class="' + cls + '" data-go="lesson" data-arg="' + l.id + '">' +
         '<span class="num">' + (i + 1) + "</span>" +
         '<span class="lbl">' + esc(l.title) + "</span>" +
         '<span class="tick">' + (p.complete ? "✓" : (p.seen ? "·" : "")) + "</span></button>";
  });
  h += '<div class="railsec">the rest</div>';
  h += '<button class="navitem' + (S.place.view === "home" ? " on" : "") + '" data-go="home"><span class="num"></span><span class="lbl">Start / about</span></button>';
  h += '<button class="navitem' + (S.place.view === "review" ? " on" : "") + '" data-go="review"><span class="num"></span><span class="lbl">Review</span><span class="tick">' + (due ? due : "") + "</span></button>";
  h += '<button class="navitem' + (S.place.view === "log" ? " on" : "") + '" data-go="log"><span class="num"></span><span class="lbl">The ledger</span></button>';
  h += '<button class="navitem' + (S.place.view === "notes" ? " on" : "") + '" data-go="notes"><span class="num"></span><span class="lbl">Notes</span></button>';
  $("#nav").innerHTML = h;
  $$("#nav .navitem").forEach(b => b.onclick = () => go(b.dataset.go, b.dataset.arg));
}

/* ── home ──────────────────────────────────────────────────── */
function viewHome() {
  const last = S.log.length ? S.log[S.log.length - 1] : null;
  const seenCount = Object.keys(S.seen).length;
  const doneCount = Object.keys(S.done).length;
  const totalEx = LESSONS.reduce((n, l) => n + exercisesOf(l).length, 0);
  const due = dueCards().length;

  let resume = "";
  if (last) {
    const l = lessonById(last.lesson);
    resume =
      '<div id="resume"><span class="tag">where you left off</span>' +
      "You last ran something " + esc(when(last.ts)) + ", in <strong>" +
      esc(l ? l.title : last.lesson) + "</strong>" +
      (last.ok === true ? " — and it passed." : last.ok === false ? " — it had not passed yet." : ".") +
      "<br>This is what you had written:" +
      '<pre style="font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:9px 0 0;color:var(--dim);' +
      'border-left:1px solid var(--edge);padding-left:11px">' + esc(last.src.slice(0, 500)) + "</pre>" +
      '<div class="actions">' +
      (l ? '<button class="btn" data-go="lesson" data-arg="' + l.id + '">back to ' + esc(l.title) + "</button>" : "") +
      '<button class="btn ghost" data-go="log">open the whole ledger</button></div></div>';
  } else {
    resume = '<div id="resume"><span class="tag">nothing recorded yet</span>' +
      "You have not run anything on this page before — or this is a different browser, or the storage was cleared. " +
      "Either way, start at <strong>Saying things out loud</strong> and nothing is required of you beforehand." +
      '<div class="actions"><button class="btn" data-go="lesson" data-arg="print">start at the first lesson</button></div></div>';
  }

  return resume +
  '<div class="kicker">the ledger</div>' +
  '<h2 class="lesson-title">Python from the beginning, built for a mind that does not picture things and does not re-live them</h2>' +
  '<p class="body">Most programming tutorials quietly assume two faculties. A mind\'s eye — <em>picture a box holding a value, visualise the call stack</em>. And a re-livable past — <em>remember when we covered loops last week</em>. With aphantasia the first is empty. With SDAM the second is empty. Neither has anything to do with whether you can learn Python: the semantic memory that holds rules, structure and language is a different system, and it is intact.</p>' +
  '<p class="body">So the scaffolding is what changes here, not the material. This is ordinary Python — real CPython, compiled to WebAssembly, running in this tab. Sixteen lessons, from <code class="inl">print</code> to writing a class of your own. What is different is everything around it.</p>' +

  '<div class="box rule"><span class="tag">instead of imagining, reading</span>' +
  "<p>Nothing in this file asks you to picture, visualise or imagine anything. Every claim is a rule stated in words. " +
  "And everything that would have been a mental image is put on the screen instead: after every single run you get " +
  "<strong>the names table</strong> — every name that exists, what it is attached to, and what kind of thing that is, " +
  "read straight out of Python — and <strong>the structure readout</strong>, which redraws your own indentation with the " +
  "block nesting marked and flags any line that does not line up. External, not internal. You are not remembering the " +
  "state of the program; you are looking at it.</p></div>" +

  '<div class="box rule"><span class="tag">instead of remembering, the ledger</span>' +
  "<p>Every run you make is written down — the time, the lesson, the exact code, the output, whether it passed — and kept. " +
  "No lesson ever says <em>as we saw earlier</em>. Each one restates its prerequisites in full, so you can open lesson nine " +
  "cold, on a Tuesday, having no sense at all of having done lessons one to eight, and not be missing a rule. " +
  "The page opens on <em>where you left off</em>, with the actual code you last wrote, because reconstructing that from " +
  "the inside is precisely the thing that does not work.</p></div>" +

  '<div class="box rule"><span class="tag">no arithmetic anywhere</span>' +
  "<p>No FizzBuzz, no fibonacci, no times tables, no factorials, no counting exercises. The examples are birds, trees, " +
  "words and tools. Numbers appear only where Python itself needs them — a length, an index — they stay small, and the " +
  "page always shows the result. Nothing here is secretly a maths test.</p></div>" +

  '<div class="box rule"><span class="tag">no pressure mechanics</span>' +
  "<p>No streaks, no timers, no scores going down, no penalties, no confetti. Nothing is locked: every lesson is open " +
  "from the start and you may read them in any order. Each states its length up front. Getting an exercise wrong logs it " +
  "and says so plainly; there is a hint ladder and a worked answer on every one, and reading the answer is a legitimate " +
  "way to learn something, not a shortcut you are being watched for. You may leave in the middle of anything — the editor " +
  "keeps what you typed.</p></div>" +

  '<hr class="sep">' +
  '<div class="kicker">so far</div>' +
  '<div class="stat">' +
    "<div><span>" + seenCount + " of " + LESSONS.length + "</span><small>lessons opened</small></div>" +
    "<div><span>" + doneCount + " of " + totalEx + "</span><small>exercises passed</small></div>" +
    "<div><span>" + S.log.length + "</span><small>runs recorded</small></div>" +
    "<div><span>" + due + "</span><small>cards due</small></div>" +
  "</div>" +

  '<div class="box note"><span class="tag">how to use it, if a suggestion helps</span>' +
  "<p>One lesson at a sitting is plenty. Run every example before reading past it — the examples are meant to be " +
  "modified and re-run, not admired. When something does not land, the fastest move is nearly always to print the thing " +
  "and look at it rather than to reason about it.</p>" +
  "<p>Come back to <strong>Review</strong> when you feel like it. It holds only the semantic residue — the rules, not the " +
  "occasions — and only from lessons you have actually opened. Two buttons, no grading.</p></div>" +

  '<hr class="sep">' +
  '<div class="kicker">keeping it</div>' +
  '<p class="body">All of this lives in this browser\'s local storage, for this file, on this machine. It survives ' +
  "reloads and closing the tab. It does <strong>not</strong> survive clearing site data, a different browser, or a " +
  "different machine — so if any of this matters to you, export it. The file it gives you is plain JSON: your progress, " +
  "your code, your notes, your whole ledger.</p>" +
  '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px">' +
    '<button class="btn" id="doExport">export everything</button>' +
    '<button class="btn" id="doImport">import a file</button>' +
    '<button class="btn ghost" id="doWipe">erase everything</button>' +
  "</div>" +
  '<input type="file" id="fileIn" accept="application/json,.json" style="display:none">' +
  '<p class="body" style="font-size:13px;color:var(--dim);margin-top:26px">Python is downloaded from a CDN the first ' +
  "time you press Run, then cached by the browser. Everything else — the lessons, your code, the ledger, the notes, " +
  "the review — works with no connection at all.</p>";
}

/* ── a lesson ──────────────────────────────────────────────── */
function viewLesson(id) {
  const l = lessonById(id);
  if (!l) return viewHome();
  const i = lessonIndex(id);
  const p = lessonProgress(l);

  let h = '<div class="kicker">lesson ' + (i + 1) + " of " + LESSONS.length + "</div>";
  h += '<h2 class="lesson-title">' + esc(l.title) + "</h2>";
  h += '<div class="meta">About ' + l.minutes + " minutes" +
       (p.total ? " · " + p.total + " exercise" + (p.total === 1 ? "" : "s") +
                  (p.done ? " · " + p.done + " passed" : "") : "") +
       (S.seen[id] ? " · first opened " + esc(when(S.seen[id])) : "") + "</div>";
  h += '<div class="box note" style="margin-top:22px"><span class="tag">why this exists</span><p>' + md(l.why) + "</p></div>";

  if (l.known && l.known.length) {
    h += '<div class="box known"><span class="tag">what this lesson stands on — stated in full, not referred back to</span><ul>' +
         l.known.map(k => "<li>" + md(k) + "</li>").join("") + "</ul></div>";
  }

  l.blocks.forEach((b, idx) => {
    if (b.t === "p")    h += '<p class="body">' + md(b.x) + "</p>";
    else if (b.t === "rule") h += '<div class="box rule"><span class="tag">rule</span><p>' + md(b.x) + "</p></div>";
    else if (b.t === "warn") h += '<div class="box warn"><span class="tag">watch out</span><p>' + md(b.x) + "</p></div>";
    else if (b.t === "note") h += '<div class="box note"><span class="tag">note</span><p>' + md(b.x) + "</p></div>";
    else if (b.t === "table") {
      h += '<table class="grid"><thead><tr>' + b.head.map(x => "<th>" + esc(x) + "</th>").join("") +
           "</tr></thead><tbody>" +
           b.rows.map(r => "<tr>" + r.map((c, ci) => "<td>" + (ci === 0 ? esc(c) : md(c)) + "</td>").join("") + "</tr>").join("") +
           "</tbody></table>";
    }
    else if (b.t === "code" || b.t === "ex") h += cellHTML(l, b, idx);
  });

  if (l.cards && l.cards.length) {
    h += '<hr class="sep"><div class="kicker">what this lesson leaves behind</div>' +
      '<p class="body" style="color:var(--dim);font-size:14px">These go into Review. They are rules, not occasions — ' +
      "the kind of thing that stays whether or not you can recall having read it.</p><ul class='plain'>" +
      l.cards.map(c => "<li>" + md(c.q) + "</li>").join("") + "</ul>";
  }

  h += '<hr class="sep"><div style="display:flex;gap:9px;flex-wrap:wrap">';
  if (i > 0) h += '<button class="btn" data-go="lesson" data-arg="' + LESSONS[i-1].id + '">← ' + esc(LESSONS[i-1].title) + "</button>";
  if (i < LESSONS.length - 1) h += '<button class="btn" data-go="lesson" data-arg="' + LESSONS[i+1].id + '">' + esc(LESSONS[i+1].title) + " →</button>";
  h += '<span class="spacer"></span><button class="btn ghost" data-go="review">review</button></div>';
  return h;
}

/* ── review ────────────────────────────────────────────────── */
let reviewQueue = null, reviewShown = false;

function viewReview() {
  const seenAny = Object.keys(S.seen).length > 0;
  if (!seenAny) {
    return '<div class="kicker">review</div><h2 class="lesson-title">Nothing to review yet</h2>' +
      '<p class="body">Review only ever holds cards from lessons you have actually opened — there is no point ' +
      'testing you on something you have not met. Open a lesson and come back.</p>' +
      '<button class="btn" data-go="lesson" data-arg="print">start at the first lesson</button>';
  }
  if (reviewQueue === null) reviewQueue = dueCards();
  if (!reviewQueue.length) {
    const all = allCards();
    const next = all.map(c => cardState(c.key).due).filter(d => d > Date.now()).sort((a, b) => a - b)[0];
    return '<div class="kicker">review</div><h2 class="lesson-title">Nothing is due</h2>' +
      '<p class="body">Every card you have met has been seen recently enough. ' +
      (next ? "The next one comes back around " + esc(when(next).replace(" ago", "")) + " from now — " +
              "roughly " + Math.max(1, Math.round((next - Date.now()) / DAY)) + " day" +
              (Math.round((next - Date.now()) / DAY) === 1 ? "" : "s") + "."
            : "") + "</p>" +
      '<p class="body" style="color:var(--dim)">There is nothing to be gained by drilling something you already have. ' +
      'You can go through them all anyway if you would rather.</p>' +
      '<div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" id="reviewAll">go through all of them anyway</button>' +
      '<button class="btn ghost" data-go="home">back to the start</button></div>';
  }
  const c = reviewQueue[0];
  const st = cardState(c.key);
  return '<div class="kicker">review · ' + reviewQueue.length + " to go</div>" +
    '<div class="card"><div class="src">' + esc(c.lesson.title) + "</div>" +
    '<div class="q">' + md(c.q) + "</div>" +
    (reviewShown ? '<div class="a">' + md(c.a) + "</div>" : "") +
    '<div class="cardbar">' +
      (reviewShown
        ? '<button class="btn run" id="knew">I had that</button>' +
          '<button class="btn" id="didnt">I did not</button>'
        : '<button class="btn run" id="show">show the answer</button>' +
          '<button class="btn ghost" id="skip">skip this one</button>') +
    "</div></div>" +
    (st.right || st.wrong
      ? '<p class="body" style="font-size:13px;color:var(--dimmer)">You have had this one right ' + st.right +
        " time" + (st.right === 1 ? "" : "s") + " and not-yet " + st.wrong + " time" + (st.wrong === 1 ? "" : "s") +
        ". Neither number does anything except sit there.</p>"
      : "") +
    '<p class="body" style="font-size:13px;color:var(--dimmer)">Saying you did not have it is not a penalty. ' +
    "It puts the card back in the near queue, which is the entire mechanism. Guessing that you knew it is the only " +
    "way to make this worse.</p>";
}

/* ── the ledger ────────────────────────────────────────────── */
function viewLog() {
  if (!S.log.length) {
    return '<div class="kicker">the ledger</div><h2 class="lesson-title">Nothing written down yet</h2>' +
      '<p class="body">Every time you press Run, this page writes down the moment, the lesson, the code exactly as you ' +
      'had it, what came out, and whether it passed. It keeps the last ' + MAX_LOG + ' of them.</p>' +
      '<p class="body">The purpose is not statistics. It is that "did I do this, and what did I write" should be a ' +
      'question you answer by <em>looking</em>, not by trying to recall an occasion.</p>' +
      '<button class="btn" data-go="lesson" data-arg="print">start at the first lesson</button>';
  }
  const rows = S.log.slice().reverse();
  let h = '<div class="kicker">the ledger</div><h2 class="lesson-title">Everything you have run here</h2>' +
    '<p class="body">Newest first. Click any line to open the code and the output exactly as they were. ' +
    "Nothing here is a score — it is a record, kept so that you never have to reconstruct one.</p>" +
    '<div class="meta">' + rows.length + " run" + (rows.length === 1 ? "" : "s") + " kept · oldest is " +
    esc(when(rows[rows.length - 1].ts)) + "</div><div style='margin-top:20px'>";
  rows.forEach((e, i) => {
    h += '<div class="entry"><div class="entryhead" data-toggle="' + i + '">' +
      '<span class="when">' + esc(when(e.ts)) + "</span>" +
      '<span class="where">' + esc(e.title || e.lesson) + "</span>" +
      '<span class="flag ' + (e.ok === true ? "ok" : e.ok === false ? "no" : "") + '">' +
      (e.ok === true ? "passed" : e.ok === false ? "not yet" : (e.err ? "error" : "ran")) + "</span></div>" +
      '<div class="entrybody" id="body' + i + '" style="display:none"><pre>' + esc(e.src) + "</pre>" +
      '<pre class="o">' + esc(e.err ? e.err : (e.out || "(nothing was printed)")) + "</pre></div></div>";
  });
  h += "</div><hr class='sep'><button class='btn ghost' id='clearLog'>erase the ledger, keep everything else</button>";
  return h;
}

/* ── notes ─────────────────────────────────────────────────── */
function viewNotes() {
  return '<div class="kicker">notes</div><h2 class="lesson-title">Your own words</h2>' +
    '<p class="body">Saved as you type, in the same place as everything else, and included in the export. ' +
    "Write in here the way you would write a comment: not what a thing does, but what you meant by it, and what " +
    "confused you before it stopped confusing you. A note written the first time round is worth a great deal more " +
    "than the same note reconstructed later.</p>" +
    '<textarea class="notes" id="notepad" spellcheck="true" placeholder="anything at all">' + esc(S.notes) + "</textarea>";
}

/* ══════════════════════════════════════════════════════════════
   ROUTER
   ══════════════════════════════════════════════════════════════ */

function render() {
  const v = S.place.view;
  if (v === "lesson") view.innerHTML = viewLesson(S.place.lesson);
  else if (v === "review") view.innerHTML = viewReview();
  else if (v === "log") view.innerHTML = viewLog();
  else if (v === "notes") view.innerHTML = viewNotes();
  else view.innerHTML = viewHome();

  renderNav();
  $$("[data-go]", view).forEach(b => b.onclick = () => go(b.dataset.go, b.dataset.arg));
  $$(".cell", view).forEach(wireCell);

  /* review buttons */
  const show = $("#show", view);
  if (show) show.onclick = () => { reviewShown = true; render(); };
  const skip = $("#skip", view);
  if (skip) skip.onclick = () => { reviewQueue.push(reviewQueue.shift()); reviewShown = false; render(); };
  const knew = $("#knew", view);
  if (knew) knew.onclick = () => { gradeCard(reviewQueue[0].key, true); reviewQueue.shift(); reviewShown = false; render(); };
  const didnt = $("#didnt", view);
  if (didnt) didnt.onclick = () => {
    const c = reviewQueue.shift(); gradeCard(c.key, false);
    reviewQueue.push(c); reviewShown = false; render();
  };
  const all = $("#reviewAll", view);
  if (all) all.onclick = () => { reviewQueue = allCards(); reviewShown = false; render(); };

  /* ledger */
  $$("[data-toggle]", view).forEach(hd => hd.onclick = () => {
    const b = $("#body" + hd.dataset.toggle, view);
    b.style.display = b.style.display === "none" ? "" : "none";
  });
  const cl = $("#clearLog", view);
  if (cl) cl.onclick = () => {
    if (confirm("Erase the record of every run? Your progress, code, notes and review schedule are all kept — only the log goes.")) {
      S.log = []; save(true); render();
    }
  };

  /* notes */
  const pad = $("#notepad", view);
  if (pad) pad.oninput = () => { S.notes = pad.value; save(); };

  /* export / import / wipe */
  const ex = $("#doExport", view);
  if (ex) ex.onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    const d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = "ledger-python-" + d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const im = $("#doImport", view);
  if (im) im.onclick = () => $("#fileIn", view).click();
  const fi = $("#fileIn", view);
  if (fi) fi.onchange = () => {
    const f = fi.files && fi.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || typeof data !== "object" || !("log" in data && "code" in data))
          throw new Error("that does not look like a ledger export");
        if (!confirm("Replace everything currently saved in this browser with the contents of that file?")) return;
        S = Object.assign(blank(), data);
        reviewQueue = null; save(true); go("home");
      } catch (e) { alert("Could not read that file: " + e.message); }
    };
    r.readAsText(f);
  };
  const wipe = $("#doWipe", view);
  if (wipe) wipe.onclick = () => {
    if (!confirm("Erase all progress, code, notes, review schedule and the whole ledger? This cannot be undone.")) return;
    if (!confirm("Really? Export first if there is any chance you want it back.")) return;
    S = blank(); reviewQueue = null; save(true); go("home");
  };
}

$("#railtoggle").onclick = () => $("#rail").classList.toggle("open");

/* Always land on the start page rather than teleporting back into the
   middle of a lesson. Re-orientation should be explicit and one click
   long, not something you are expected to do from the inside. */
S.place.view = "home";
render();
bootPython();
</script>
