<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger — learning Python without pictures or episodes</title>
<style>
/* ────────────────────────────────────────────────────────────
   THE LEDGER — learning Python without pictures or episodes

   Most programming tutorials lean on two things the author
   assumes you have: a mind's eye ("picture a box holding a
   value", "visualise the stack") and a re-livable past
   ("remember when we did loops last week?").

   If you have aphantasia, the first is empty. If you have SDAM,
   the second is empty. Neither absence stops you learning Python
   — semantic memory, rules, structure, language: all intact. But
   the *scaffolding* has to change.

   So this file:
     · never says "imagine" or "picture". Every claim is a rule
       stated in words, and every rule that could have been a
       mental picture is rendered on screen instead — the live
       table of names and values after every run, the structure
       readout of your own indentation. Externalised, not
       imagined.
     · never says "remember when". Each lesson restates its
       prerequisites in full. Nothing depends on re-living an
       earlier session.
     · keeps the ledger. Every run you ever make is written down
       with its timestamp and its output. Your past is a document
       you can open, not a scene you have to reconstruct.
     · contains no arithmetic. No FizzBuzz, no fibonacci, no
       times tables. Numbers appear only where Python itself
       needs them, and the page always shows the result.
     · has no streaks, no timers, no penalties, no confetti.
       Nothing is locked. Every lesson states its length up
       front. You may leave in the middle of anything.

   Real CPython, compiled to WebAssembly, running in the tab.
   Not a simulation of Python — Python.
   ──────────────────────────────────────────────────────────── */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    #0a0908;
    --panel: #12100e;
    --panel2:#181512;
    --edge:  #2a2521;
    --ink:   #c8c0b8;
    --dim:   rgba(200,192,184,0.42);
    --dimmer:rgba(200,192,184,0.22);
    --teal:  #5ba8a0;
    --warm:  #e85d45;
    --amber: #d9a05b;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --text: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--text); font-size: 16px; line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--teal); }

  /* ── shell ─────────────────────────────────────────────── */
  #shell { display: flex; min-height: 100vh; align-items: stretch; }
  #rail {
    width: 260px; flex: 0 0 260px; border-right: 1px solid var(--edge);
    background: var(--panel); padding: 22px 0 40px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  #main { flex: 1 1 auto; min-width: 0; padding: 32px 40px 140px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  #brand { padding: 0 20px 18px; border-bottom: 1px solid var(--edge); margin-bottom: 14px; }
  #brand h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  #brand p { font-size: 12px; color: var(--dim); line-height: 1.45; margin-top: 4px; }

  .railsec { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
             color: var(--dimmer); padding: 16px 20px 6px; }
  .navitem {
    display: flex; gap: 10px; align-items: baseline; width: 100%;
    padding: 7px 20px; background: none; border: 0; text-align: left;
    color: var(--dim); font: inherit; font-size: 13.5px; cursor: pointer;
    border-left: 2px solid transparent;
  }
  .navitem:hover { color: var(--ink); background: rgba(255,255,255,0.022); }
  .navitem.on { color: var(--ink); border-left-color: var(--teal); background: rgba(91,168,160,0.06); }
  .navitem .num { font-family: var(--mono); font-size: 11px; color: var(--dimmer); flex: 0 0 18px; }
  .navitem.done .num { color: var(--teal); }
  .navitem .lbl { flex: 1 1 auto; }
  .navitem .tick { color: var(--teal); font-size: 11px; }
  .navitem.started .tick { color: var(--amber); }

  /* ── typography ────────────────────────────────────────── */
  h2.lesson-title { font-size: 27px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
            text-transform: uppercase; color: var(--dimmer); margin-bottom: 9px; }
  .meta { color: var(--dim); font-size: 13px; margin-top: 10px; }
  p.body { margin: 15px 0; }
  code.inl { font-family: var(--mono); font-size: 0.885em; background: #1d1916;
             border: 1px solid var(--edge); border-radius: 3px; padding: 1px 5px; color: #ddd4ca; }
  strong { color: #ece4da; font-weight: 600; }
  em { color: var(--dim); font-style: italic; }

  .box { border-left: 2px solid var(--edge); background: var(--panel);
         padding: 13px 16px; margin: 18px 0; border-radius: 0 4px 4px 0; }
  .box .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
              text-transform: uppercase; display: block; margin-bottom: 5px; }
  .box.rule  { border-left-color: var(--teal); }
  .box.rule .tag { color: var(--teal); }
  .box.warn  { border-left-color: var(--warm); }
  .box.warn .tag { color: var(--warm); }
  .box.note  { border-left-color: var(--amber); }
  .box.note .tag { color: var(--amber); }
  .box.known { border-left-color: var(--dimmer); background: transparent;
               border: 1px dashed var(--edge); border-radius: 4px; }
  .box.known .tag { color: var(--dimmer); }
  .box.known ul { margin: 0; padding-left: 18px; }
  .box.known li { margin: 3px 0; font-size: 14.5px; color: var(--dim); }
  .box p { margin: 0; }
  .box p + p { margin-top: 8px; }

  ul.plain { margin: 14px 0 14px 20px; }
  ul.plain li { margin: 5px 0; }

  table.grid { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14px; }
  table.grid th, table.grid td { text-align: left; padding: 7px 10px;
      border-bottom: 1px solid var(--edge); vertical-align: top; }
  table.grid th { color: var(--dimmer); font-weight: 500; font-size: 11px;
      letter-spacing: 0.1em; text-transform: uppercase; }
  table.grid td:first-child { font-family: var(--mono); font-size: 12.5px; color: var(--amber); white-space: nowrap; }

  /* ── code cells ────────────────────────────────────────── */
  .cell { border: 1px solid var(--edge); border-radius: 5px; background: var(--panel);
          margin: 20px 0; overflow: hidden; }
  .cell.exercise { border-color: #35302a; }
  .cellhead { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
              border-bottom: 1px solid var(--edge); background: var(--panel2); }
  .cellhead .ctag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
                    text-transform: uppercase; color: var(--dimmer); flex: 1 1 auto; }
  .cellhead .ctag.ex { color: var(--amber); }
  .cellhead .ctag.ok { color: var(--teal); }
  .prompt { padding: 13px 14px; border-bottom: 1px solid var(--edge); font-size: 15px; }
  .prompt p { margin: 0; }
  .prompt p + p { margin-top: 8px; }

  textarea.editor {
    display: block; width: 100%; border: 0; outline: 0; resize: vertical;
    background: #0e0c0a; color: #ddd4ca; font-family: var(--mono);
    font-size: 13.5px; line-height: 1.62; padding: 12px 14px; tab-size: 4;
    min-height: 76px; white-space: pre; overflow-x: auto;
  }
  textarea.editor:focus { background: #100e0b; }
  textarea.inputs {
    display: block; width: 100%; border: 0; border-top: 1px solid var(--edge);
    outline: 0; resize: vertical; background: #0c0b09; color: var(--amber);
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6; padding: 8px 14px;
    min-height: 30px;
  }
  .inputlbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
              text-transform: uppercase; color: var(--dimmer); padding: 7px 14px 0;
              border-top: 1px solid var(--edge); background: #0c0b09; }

  .cellbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
             padding: 9px 12px; border-top: 1px solid var(--edge); background: var(--panel2); }
  .spacer { flex: 1 1 auto; }

  button.btn {
    font: inherit; font-size: 12.5px; padding: 5px 13px; border-radius: 4px;
    border: 1px solid var(--edge); background: #1c1815; color: var(--ink);
    cursor: pointer; line-height: 1.5;
  }
  button.btn:hover { background: #262019; border-color: #3d3630; }
  button.btn:disabled { opacity: 0.4; cursor: default; }
  button.btn.run { border-color: rgba(91,168,160,0.5); color: var(--teal); }
  button.btn.run:hover { background: rgba(91,168,160,0.12); }
  button.btn.ghost { border-color: transparent; color: var(--dim); background: none; }
  button.btn.ghost:hover { color: var(--ink); background: rgba(255,255,255,0.04); }

  .out { border-top: 1px solid var(--edge); background: #0b0a09; }
  .outsec { padding: 10px 14px; border-bottom: 1px solid rgba(42,37,33,0.6); }
  .outsec:last-child { border-bottom: 0; }
  .outlbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
            text-transform: uppercase; color: var(--dimmer); margin-bottom: 6px; }
  pre.stream { font-family: var(--mono); font-size: 13px; line-height: 1.6;
               white-space: pre-wrap; word-break: break-word; color: #ddd4ca; margin: 0; }
  pre.stream.err { color: var(--warm); }
  pre.stream.empty { color: var(--dimmer); font-style: italic; }

  table.vars { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
  table.vars td { padding: 3px 8px 3px 0; vertical-align: top; border-bottom: 1px solid rgba(42,37,33,0.5); }
  table.vars tr:last-child td { border-bottom: 0; }
  table.vars .vn { color: var(--amber); white-space: nowrap; }
  table.vars .vt { color: var(--dimmer); white-space: nowrap; }
  table.vars .vv { color: #ddd4ca; word-break: break-word; }

  pre.struct { font-family: var(--mono); font-size: 12.5px; line-height: 1.65; margin: 0;
               color: var(--dim); white-space: pre-wrap; }
  pre.struct .ln { color: var(--dimmer); }
  pre.struct .gd { color: rgba(91,168,160,0.35); }
  pre.struct .src { color: #ddd4ca; }
  pre.struct .bad { color: var(--warm); }

  .verdict { padding: 11px 14px; border-top: 1px solid var(--edge); font-size: 14px; }
  .verdict.pass { background: rgba(91,168,160,0.09); color: #a9d8d2; }
  .verdict.fail { background: rgba(232,93,69,0.07); color: #f0b3a6; }
  .verdict .vh { font-weight: 600; display: block; margin-bottom: 3px; }
  .verdict pre { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap;
                 margin-top: 7px; color: inherit; opacity: 0.86; }
  .hintbox { padding: 11px 14px; border-top: 1px solid var(--edge);
             background: rgba(217,160,91,0.06); font-size: 14px; color: #e0c79c; }
  .hintbox b { color: var(--amber); }

  /* ── status / banner ───────────────────────────────────── */
  #resume { border: 1px solid var(--edge); border-left: 2px solid var(--amber);
            background: var(--panel); padding: 13px 16px; border-radius: 0 4px 4px 0;
            margin-bottom: 30px; font-size: 14px; }
  #resume .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
                 text-transform: uppercase; color: var(--amber); display: block; margin-bottom: 5px; }
  #resume .actions { margin-top: 9px; display: flex; gap: 8px; flex-wrap: wrap; }

  #pystat { position: fixed; right: 14px; bottom: 12px; z-index: 40;
            font-family: var(--mono); font-size: 11px; color: var(--dimmer);
            background: var(--panel); border: 1px solid var(--edge);
            padding: 5px 11px; border-radius: 20px; }
  #pystat.ready { color: var(--teal); border-color: rgba(91,168,160,0.35); }
  #pystat.fail  { color: var(--warm); border-color: rgba(232,93,69,0.4); cursor: pointer; }

  /* ── review ────────────────────────────────────────────── */
  .card { border: 1px solid var(--edge); border-radius: 5px; background: var(--panel);
          padding: 26px 22px; margin: 22px 0; }
  .card .q { font-size: 19px; line-height: 1.45; }
  .card .a { font-size: 15.5px; color: var(--dim); margin-top: 16px;
             padding-top: 16px; border-top: 1px solid var(--edge); }
  .card .src { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
               text-transform: uppercase; color: var(--dimmer); margin-bottom: 12px; }
  .cardbar { display: flex; gap: 9px; margin-top: 20px; flex-wrap: wrap; }

  /* ── ledger / notes ────────────────────────────────────── */
  .entry { border: 1px solid var(--edge); border-radius: 5px; background: var(--panel);
           margin: 12px 0; overflow: hidden; }
  .entryhead { display: flex; gap: 10px; align-items: baseline; padding: 8px 13px;
               background: var(--panel2); border-bottom: 1px solid var(--edge);
               font-size: 12.5px; color: var(--dim); cursor: pointer; }
  .entryhead .when { font-family: var(--mono); font-size: 11px; color: var(--dimmer); }
  .entryhead .where { flex: 1 1 auto; }
  .entryhead .flag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; }
  .entryhead .flag.ok { color: var(--teal); }
  .entryhead .flag.no { color: var(--warm); }
  .entrybody { padding: 0; }
  .entrybody pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
                   padding: 11px 13px; margin: 0; white-space: pre-wrap; color: #ddd4ca; }
  .entrybody pre.o { border-top: 1px solid var(--edge); background: #0b0a09; color: var(--dim); }

  textarea.notes { width: 100%; min-height: 320px; background: var(--panel);
                   border: 1px solid var(--edge); border-radius: 5px; color: var(--ink);
                   font-family: var(--mono); font-size: 13.5px; line-height: 1.65;
                   padding: 14px; outline: 0; resize: vertical; }
  textarea.notes:focus { border-color: #3d3630; }

  .stat { display: flex; gap: 26px; flex-wrap: wrap; margin: 18px 0 26px; }
  .stat div span { display: block; font-family: var(--mono); font-size: 21px; color: var(--ink); }
  .stat div small { font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--dimmer); }

  hr.sep { border: 0; border-top: 1px solid var(--edge); margin: 34px 0; }

  #railtoggle { display: none; }

  @media (max-width: 860px) {
    #shell { display: block; }
    #rail { position: fixed; left: 0; top: 0; z-index: 60; transform: translateX(-100%);
            transition: transform 0.18s ease; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
    #rail.open { transform: translateX(0); }
    #main { padding: 68px 18px 120px; }
    #railtoggle { display: block; position: fixed; left: 12px; top: 12px; z-index: 61; }
    h2.lesson-title { font-size: 23px; }
    #pystat { left: 12px; right: auto; }
  }
</style>
</head>
<body>
<button id="railtoggle" class="btn">☰ lessons</button>
<div id="shell">
  <nav id="rail">
    <div id="brand">
      <h1>The Ledger</h1>
      <p>Python from the beginning — no pictures required, no past to re-live.</p>
    </div>
    <div id="nav"></div>
  </nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div id="pystat">python: starting…</div>
<script>
/* ══════════════════════════════════════════════════════════════
   THE CURRICULUM

   Every lesson carries:
     why    — one sentence on why the thing exists at all. Not
              "you'll need it later". A reason you can hold now.
     known  — the prerequisites, RESTATED IN FULL. Never a
              back-reference. You should be able to start at
              lesson 9 cold and not be missing a rule.
     blocks — prose, rules, warnings, worked code, exercises.
     cards  — the semantic residue: facts worth reviewing. Not
              "what did you do on Tuesday" — "what does return do".
   ══════════════════════════════════════════════════════════════ */

const LESSONS = [

/* ── 1 ─────────────────────────────────────────────────────── */
{
  id: "print", title: "Saying things out loud", minutes: 6,
  why: "A running program is silent. print is the one thing that makes it tell you what it is doing — and you will use it more than anything else in this file.",
  known: [],
  blocks: [
    {t:"p", x:"Python does what you write, in the order you wrote it. Top line first, then the next, then the next, until it runs out of lines. There is nothing clever going on underneath. That is genuinely the whole model."},
    {t:"rule", x:"`print(X)` writes X into the output, then starts a new line."},
    {t:"rule", x:"Text has to be wrapped in quotes: `'like this'` or `\"like this\"`. Both work exactly the same. Pick one and stay with it — this file uses double quotes."},
    {t:"code", src:'print("hello")\nprint("this is a second line")', note:"Two prints, two lines, in the order written. Press Run."},
    {t:"p", x:"The output panel underneath is the whole point. You never have to hold the result in your head — it is written down, on screen, until you change it."},
    {t:"warn", x:"Leave the quotes off and Python assumes you meant the *name* of something (lesson 2) rather than the text itself, and stops with `NameError`. It is the single most common first error. It means nothing about you."},
    {t:"code", src:'print(hello)', note:"This one is meant to fail. Run it and read the error — the last line is the part that talks."},
    {t:"rule", x:"`print()` with nothing inside prints an empty line. Useful for spacing things out."},
    {t:"ex", id:"p1",
      prompt:"Make it print your name — or any word. One line, one print.",
      starter:'print("")',
      check:{ require:[["print\\s*\\(", "use print(...)"]], nonempty:true },
      hints:["Put the word inside the quotes that are already there.",
             "It should look like: print(\"Vee\") — with your word between the quotes."],
      solution:'print("Vee")'},
    {t:"ex", id:"p2",
      prompt:"Print exactly these three lines, in this order:\n\napple\npear\nquince",
      starter:"",
      check:{ out:"apple\npear\nquince" },
      hints:["Three separate print lines, one under the other.",
             "Each word needs its own quotes. print(\"apple\") is line one."],
      solution:'print("apple")\nprint("pear")\nprint("quince")'}
  ],
  cards: [
    {q:"What does print(X) do?", a:"Writes X into the output, then starts a new line."},
    {q:"How do you write a piece of text in Python?", a:"Wrap it in quotes — \"like this\" or 'like this'. Without quotes, Python reads it as a name instead and raises NameError."}
  ]
},

/* ── 2 ─────────────────────────────────────────────────────── */
{
  id: "names", title: "Names", minutes: 9,
  why: "You need a way to say \"the thing I made a moment ago\" without writing it out again. That is all a variable is.",
  known: [
    "`print(X)` writes X into the output and starts a new line.",
    "Text goes in quotes: `\"hello\"`. Without quotes Python reads it as a name."
  ],
  blocks: [
    {t:"rule", x:"`name = value` attaches the name on the left to the value on the right."},
    {t:"warn", x:"`=` does **not** mean \"equals\". It means \"attach\". It always runs right-to-left: Python works out the right-hand side first, then attaches the name to the result. Reading `x = y` as a statement of fact will mislead you every time; read it as an instruction — *attach x to y*."},
    {t:"code", src:'greeting = "hello"\nwho = "world"\nprint(greeting)\nprint(who)', note:"Two names, two attachments, then two prints. Run it and look at the NAMES table underneath the output."},
    {t:"note", x:"You do not have to picture any of this. Underneath every run, this page prints the actual table of every name currently in existence, what it is attached to, and what kind of thing that is. Read the table. It is not a hint or a simplification — it is the real state, read straight out of Python."},
    {t:"p", x:"A name is a label, not a container. Nothing is stored *inside* `greeting`. If you attach the same name to something else later, the label simply moves — the old value is not modified, it is just no longer labelled."},
    {t:"code", src:'x = "first"\nprint(x)\nx = "second"\nprint(x)', note:"One name, attached twice. The table at the end shows only the final attachment — that is the honest picture: only now exists."},
    {t:"rule", x:"`+` between two pieces of text joins them together, adding nothing in between. If you want a space, you supply it yourself."},
    {t:"code", src:'first = "Ada"\nlast = "Lovelace"\nfull = first + " " + last\nprint(full)', note:'Notice the " " — a piece of text containing one space. Take it out and re-run to see what happens.'},
    {t:"rule", x:"Name rules: letters, digits and underscores; may not start with a digit; case matters. `name` and `Name` are two different names. Convention is lowercase with underscores: `first_name`."},
    {t:"warn", x:"`=` attaches. `==` asks a question (lesson 5). They look similar and mean completely unrelated things. This trips up everyone; it is not a sign you are missing something."},
    {t:"ex", id:"n1",
      prompt:"Attach `animal` to the text \"otter\", attach `sound` to the text \"chirp\", then print exactly:\n\nThe otter says chirp.",
      starter:'animal = \nsound = \n',
      check:{ out:"The otter says chirp.", require:[["animal\\s*=","attach a name called animal"],["sound\\s*=","attach a name called sound"]] },
      hints:["Build the sentence with + : \"The \" + animal + \" says \" + sound + \".\"",
             "Watch the spaces. \"The \" has a space before the closing quote, and \" says \" has one at each end.",
             "print(\"The \" + animal + \" says \" + sound + \".\")"],
      solution:'animal = "otter"\nsound = "chirp"\nprint("The " + animal + " says " + sound + ".")'},
    {t:"ex", id:"n2",
      prompt:"Attach `word` to \"stone\". Print it. Then attach the same name `word` to \"water\" and print it again. Two lines of output: stone, then water.",
      starter:"",
      check:{ out:"stone\nwater", require:[["word","use a name called word"]] },
      hints:["Four lines: attach, print, attach again, print again.",
             "word = \"stone\" / print(word) / word = \"water\" / print(word)"],
      solution:'word = "stone"\nprint(word)\nword = "water"\nprint(word)'}
  ],
  cards: [
    {q:"What does the = sign actually mean in Python?", a:"Attach. The name on the left becomes a label for the value on the right. Python evaluates the right-hand side first, then attaches. It is an instruction, not a statement of fact."},
    {q:"What does + do between two pieces of text?", a:"Joins them, adding nothing in between. Spaces have to be supplied yourself: first + \" \" + last."},
    {q:"Are `name` and `Name` the same name in Python?", a:"No. Names are case-sensitive — those are two entirely separate names."}
  ]
},

/* ── 3 ─────────────────────────────────────────────────────── */
{
  id: "kinds", title: "Kinds of thing", minutes: 9,
  why: "Python treats text and numbers as different kinds of thing, and the same symbol means different things depending on which you have. Most baffling early errors are really a kind mismatch.",
  known: [
    "`print(X)` writes X and starts a new line.",
    "`name = value` attaches the name on the left to the value on the right.",
    "`+` between two pieces of text joins them."
  ],
  blocks: [
    {t:"note", x:"Nothing in this file requires you to do arithmetic. Numbers show up only where Python itself needs them, they stay small, and the page always shows you the result. This is not a maths test and never becomes one."},
    {t:"p", x:"Every value in Python is of some kind — Python calls it a *type*. There are four you need now."},
    {t:"table", head:["written","type","what it is"], rows:[
      ['"12"',   "str",   "text. The quotes are what make it text."],
      ["12",     "int",   "a whole number."],
      ["12.5",   "float", "a number with a decimal point."],
      ["True",   "bool",  "one of exactly two values: True or False. Capital letter, no quotes."]
    ]},
    {t:"rule", x:"`type(X)` hands back the kind of X. Print it when you are not sure — you are allowed to just look."},
    {t:"code", src:'print(type("12"))\nprint(type(12))\nprint(type(12.5))\nprint(type(True))', note:"Four kinds, named out loud."},
    {t:"rule", x:"`+` between two `str` values joins them. `+` between two `int` values adds them. Same symbol, two different operations, decided by the kinds on either side."},
    {t:"code", src:'print("12" + "3")\nprint(12 + 3)', note:'The first is a join and gives "123". The second is an addition and gives 15. The quotes are the entire difference.'},
    {t:"warn", x:"`\"12\" + 3` is an error — `TypeError`. Python refuses to guess whether you wanted \"123\" or 15. That refusal is deliberate and it is on your side: a language that guessed would give you a wrong answer silently instead of an error you can read."},
    {t:"rule", x:"`str(X)` makes a text version of X. `int(X)` makes a whole number out of text that looks like one. These are how you deliberately cross between kinds."},
    {t:"code", src:'count = 3\nprint("I have " + str(count) + " of them")', note:"count is an int; str(count) is the text \"3\"; now everything being joined is text, so + is a join."},
    {t:"ex", id:"k1",
      prompt:"This line is broken. Run it first and read the error, then fix it so it prints exactly:\n\nthere are 4 chairs",
      starter:'chairs = 4\nprint("there are " + chairs + " chairs")',
      check:{ out:"there are 4 chairs" },
      hints:["chairs is an int. The things either side of it are text. Python will not mix them.",
             "Wrap chairs in str( ) so that everything in the line is text.",
             'print("there are " + str(chairs) + " chairs")'],
      solution:'chairs = 4\nprint("there are " + str(chairs) + " chairs")'},
    {t:"ex", id:"k2",
      prompt:"Attach `a` to the text \"5\" and `b` to the number 5. Print the type of each — two lines of output.",
      starter:"",
      check:{ out:"<class 'str'>\n<class 'int'>" },
      hints:['"5" with quotes is text. 5 without quotes is a number.',
             'a = "5" / b = 5 / print(type(a)) / print(type(b))'],
      solution:'a = "5"\nb = 5\nprint(type(a))\nprint(type(b))'}
  ],
  cards: [
    {q:"What is the difference between \"12\" and 12?", a:"\"12\" is a str — text. 12 is an int — a number. The quotes are the only difference and they change what + does."},
    {q:"Why does \"12\" + 3 raise a TypeError?", a:"Python will not guess whether you meant to join (giving \"123\") or to add (giving 15), so it refuses and tells you. Fix it by making both sides the same kind: str(3) or int(\"12\")."},
    {q:"How do you find out what kind of thing a value is?", a:"type(X) — and print it. Looking is allowed."}

},

/* ── 4 ─────────────────────────────────────────────────────── */
{
  id: "fstrings", title: "Filling in the blanks", minutes: 9,
  why: "Joining text with + works, but it makes you convert every number by hand and count your own spaces. An f-string lets you write the sentence you actually want and drop the values into it.",
  known: [
    "`print(X)` writes X and starts a new line.",
    "`name = value` attaches the name on the left to the value on the right.",
    "Text is `str`, whole numbers are `int`. `+` joins two strs but adds two ints, and mixing them is a `TypeError`.",
    "`str(X)` makes a text version of X; `len(X)` gives the length of a piece of text."
  ],
  blocks: [
    {t:"rule", x:"Put an `f` immediately before the opening quote, and then anything you write inside `{ }` is worked out and dropped into the text. `f\"Hello, {name}\"`."},
    {t:"rule", x:"**You do not need `str()` inside an f-string.** Whatever is in the braces gets converted to text for you. That is the main reason to reach for one."},
    {t:"code", src:'name = "Vee"\ncount = 3\n\nprint("Hello, " + name + " - you have " + str(count) + " of them")\nprint(f"Hello, {name} - you have {count} of them")',
      note:"Identical output. One of them you can read at a glance, and one of them you had to assemble."},
    {t:"p", x:"The braces are the whole idea: you write the sentence in one piece, in the order a person reads it, and mark the holes. No counting the spaces at the ends of fragments, no wrapping numbers in `str()`, no chain of `+` to lose your place in."},
    {t:"warn", x:"The `f` has to be there. Without it, `\"Hello, {name}\"` prints the braces exactly as written — you will see `{name}` sitting in your output. It is the commonest f-string mistake and it announces itself immediately, which makes it one of the harmless ones."},
    {t:"code", src:'name = "Vee"\nprint("Hello, {name}")\nprint(f"Hello, {name}")', note:"The forgotten f, then the same line with it. Run it and compare the two lines of output."},
    {t:"rule", x:"Anything that produces a value can go inside the braces — a name, an item out of a list, a call to a function, a whole expression: `f\"{len(birds)} birds\"`, `f\"the first is {birds[0]}\"`."},
    {t:"code", src:'birds = ["heron", "wren", "crow"]\nprint(f"There are {len(birds)} birds, and the first is {birds[0]}.")',
      note:"Two holes, both filled by working something out rather than by a plain name."},
    {t:"note", x:"Keep what is inside the braces short. If it is turning into real work, do the work on a line above and attach a name to the result, then drop the name in. The braces are for placing a value, not for thinking in."},
    {t:"rule", x:"`f\"{value!r}\"` drops in the **repr** rather than the plain text — which for a str means you get the quotes too. Use it when you need to see whether something has a stray space on the end, or whether that 7 is text or a number."},
    {t:"code", src:'answer = "7 "\nprint(f"you said {answer} and that is that")\nprint(f"you said {answer!r} and that is that")',
      note:"The same value twice. Only the second one shows you the trailing space that is about to cause a problem."},
    {t:"note", x:"One shorthand worth having on the first day: `f\"{name=}\"` prints the name **and** its value — `name='Vee'`. It is the fastest possible version of print-it-and-look, and it is impossible to mislabel because Python writes the label for you."},
    {t:"code", src:'word = "heron"\ncount = 3\nprint(f"{word=} {count=}")', note:"Two names, labelled and shown, with nothing typed twice."},
    {t:"note", x:"From here on every exercise checks **the output**, never how you built it — `+` and f-strings are both accepted everywhere, always. A few later examples deliberately keep using `+` where the point being made is about types meeting. The rest use f-strings, because that is overwhelmingly what you will meet in real code."},
    {t:"ex", id:"fs1",
      prompt:"Attach `animal` to \"otter\" and `sound` to \"chirp\", then use an f-string to print exactly:\n\nThe otter says chirp.",
      starter:'animal = "otter"\nsound = "chirp"\n',
      check:{ out:"The otter says chirp.", require:[["f[\"']", "use an f-string - an f immediately before the opening quote"]],
              forbid:[["\\+", "build it with an f-string this time rather than with +"]] },
      hints:["Write the sentence in one piece and put braces where the values go.",
             'print(f"The {animal} says {sound}.")'],
      solution:'animal = "otter"\nsound = "chirp"\nprint(f"The {animal} says {sound}.")'},
    {t:"ex", id:"fs2",
      prompt:"Using the list below, print exactly:\n\nThere are 3 tools, and the last one is awl.\n\nDo not type the number 3 yourself - work it out from the list.",
      starter:'tools = ["chisel", "rasp", "awl"]\n',
      check:{ out:"There are 3 tools, and the last one is awl.",
              require:[["f[\"']", "use an f-string"], ["len\\s*\\(", "use len() rather than typing the number"],
                       ["\\[-1\\]", "use [-1] for the last one"]] },
      hints:["len(tools) goes in the first pair of braces.",
             "tools[-1] is the last one, and it can go straight inside braces too.",
             'print(f"There are {len(tools)} tools, and the last one is {tools[-1]}.")'],
      solution:'tools = ["chisel", "rasp", "awl"]\nprint(f"There are {len(tools)} tools, and the last one is {tools[-1]}.")'}
  ],
  cards: [
    {q:"What does the f before the opening quote do?", a:"It makes the text an f-string: anything inside { } is worked out and dropped in. Without the f you get the braces printed literally."},
    {q:"Why do you not need str() inside an f-string?", a:"An f-string converts whatever is in the braces to text by itself. That is the main reason to use one over a chain of +."},
    {q:"What does f\"{name=}\" print?", a:"Both the name and its value - name='Vee'. The fastest form of print-it-and-look, and it cannot be mislabelled because Python writes the label."},
    {q:"When would you write f\"{value!r}\" instead of f\"{value}\"?", a:"When you need the repr rather than the plain text - to see quotes, or a stray trailing space, or whether a 7 is a str or an int."}
  ]
},

/* ── 6 ─────────────────────────────────────────────────────── */
{
  id: "choose", title: "Choosing", minutes: 11,
  why: "Everything interesting a program does comes from doing one thing in some situations and a different thing in others.",
  known: [
    "`print(X)` writes X and starts a new line.",
    "`name = value` attaches the name to the value.",
    "`input(\"prompt\")` waits for a typed line and hands it back as text.",
    "`f\"text {name} and {count}\"` drops those values into the text, converting them for you - an f-string. No `str()` needed."
  ],
  blocks: [
    {t:"rule", x:"`==` asks *are these two the same?* and hands back `True` or `False`. It is a question. `=` attaches. They are unrelated."},
    {t:"table", head:["written","asks"], rows:[
      ["a == b", "are they the same?"],
      ["a != b", "are they different?"],
      ["a < b",  "is a smaller? For text, this means earlier in alphabetical order."],
      ["a > b",  "is a larger? For text, later in alphabetical order."],
      ["a in b", "does a appear inside b? Works for text-inside-text and for lists."]
    ]},
    {t:"code", src:'print("cat" == "cat")\nprint("cat" == "dog")\nprint("at" in "cat")', note:"Questions, asked out loud. Each one produces True or False and nothing else."},
    {t:"rule", x:"`if CONDITION:` runs the indented lines underneath it, but only when the condition is True. The colon at the end is required. The indentation is required."},
    {t:"warn", x:"Indentation is not decoration in Python — it is the only thing that says which lines belong to the `if`. Four spaces per level. **The Tab key in these editors inserts exactly four spaces**, and pressing Enter after a line ending in `:` indents the next line for you."},
    {t:"note", x:"Under every run there is a **structure** panel that redraws your code with the block nesting marked out, and flags any line whose indentation does not line up. If you are ever unsure which lines are inside which block, open it and read — do not try to hold the shape in your head."},
    {t:"code", src:'weather = "rain"\nif weather == "rain":\n    print("take the coat")\nprint("leave the house")',
      note:"Only the first print is indented, so only it is inside the if. The second happens regardless. Change \"rain\" to \"sun\" and run again — one line of output instead of two."},
    {t:"rule", x:"`else:` runs when the `if` did not. `elif CONDITION:` means *otherwise, if* — you may have as many as you like."},
    {t:"rule", x:"In an `if` / `elif` / `else` chain **exactly one** branch runs. Python checks the conditions top to bottom, takes the first True one, and skips every other branch entirely — including ones that would also have been True."},
    {t:"code", src:'animal = "crow"\nif animal == "otter":\n    print("river")\nelif animal == "crow":\n    print("air")\nelse:\n    print("somewhere else")',
      note:"Three branches written, one branch run."},
    {t:"warn", x:"`if x = \"rain\":` is a syntax error — that is the attach symbol, and Python will not let you attach inside a question. You want `==`."},
    {t:"ex", id:"c1",
      prompt:"Attach `door` to \"locked\". If it is \"locked\", print `wait outside`; otherwise print `go in`. Then, on the line after the whole if, always print `done`.",
      starter:'door = "locked"\n',
      check:{ out:"wait outside\ndone", require:[["if\\b","use an if"],["else\\s*:","use an else"]] },
      hints:["The last print must NOT be indented — that is what makes it happen either way.",
             'if door == "locked": / (indented) print("wait outside") / else: / (indented) print("go in") / then print("done") at no indent'],
      solution:'door = "locked"\nif door == "locked":\n    print("wait outside")\nelse:\n    print("go in")\nprint("done")'},
    {t:"ex", id:"c2",
      prompt:"Attach `creature` to \"heron\". Write a chain that prints `river` for \"otter\", `air` for \"heron\", `hedge` for \"wren\", and `unlisted` for anything else. It should print exactly:\n\nair",
      starter:'creature = "heron"\n',
      check:{ out:"air", require:[["elif\\b","use at least one elif"],["else\\s*:","use an else"]] },
      hints:["if for the first, elif for the middle two, else for the fallback.",
             "Each branch is one indented print. Only one of the four will run."],
      solution:'creature = "heron"\nif creature == "otter":\n    print("river")\nelif creature == "heron":\n    print("air")\nelif creature == "wren":\n    print("hedge")\nelse:\n    print("unlisted")'}
  ],
  cards: [
    {q:"What is the difference between = and == ?", a:"= attaches a name to a value (an instruction). == asks whether two values are the same and produces True or False (a question). Unrelated operations."},
    {q:"In an if / elif / else chain, how many branches run?", a:"Exactly one. Python takes the first condition that is True, runs that branch, and skips all the others — even ones that would also have been True."},
    {q:"What decides which lines are inside an if?", a:"The indentation, and only the indentation. Four spaces per level. Python has no braces or end keyword; the whitespace is the syntax."}
  ]
},

    "`print(X)` writes X and starts a new line.",

    {t:"rule", x:"`things[0]` is the **first** item. Counting starts at zero."},
    {t:"p", x:"The honest reason, since \"just because\" is not an explanation: the number in the brackets is not a position, it is a **distance from the start**. The first item is zero away from the start; the second is one away. You do not have to like it. You do have to know it, because every list in every language you meet will do it."},

    {t:"note", x:"Almost nothing in real Python needs you to calculate an index. `[0]`, `[-1]`, and looping over the whole thing (next lesson) cover the overwhelming majority of cases. If you find yourself doing arithmetic to reach an item, there is nearly always a way to loop instead."},

      ["x in things",         "True if x is one of the items."],

    {q:"How do you get the last item of a list without knowing its length?", a:"things[-1]. Negative indexes count back from the end."},

{
  id: "repeat", title: "Repeating", minutes: 11,

  blocks: [

    {t:"code", src:'trees = ["alder", "birch"]\nfor tree in trees:\n    print(tree)\nprint("that is all of them")',
      note:"Two indented runs, then one unindented line, once. Open the structure panel underneath if the shape is not obvious from the text."},
    {t:"p", x:"The commonest useful shape in all of Python: start an empty list, loop over something, and append to the new list as you go."},
    {t:"code", src:'words = ["willow", "alder", "birch", "blackthorn"]\nlong_ones = []\nfor word in words:\n    if len(word) > 5:\n        long_ones.append(word)\nprint(long_ones)',

{

    "`for item in things:` runs its indented block once per item, in order.",

  blocks: [
    {t:"p", x:"Here is a shape you will write over and over: make an empty list, loop over something, keep the ones you want, append them to the new list. Four lines, and the middle two do the thinking."},
    {t:"code", src:'birds = ["heron", "wren", "crow", "kite"]\n\nshort = []\nfor bird in birds:\n    if len(bird) == 4:\n        short.append(bird)\n\nprint(short)',
      note:"The long form. Nothing wrong with it - it is clear, and it will never be wrong."},
    {t:"rule", x:"`[EXPRESSION for ITEM in THINGS]` builds a new list by working out EXPRESSION once for every item. It is the same four lines, written as one, and it hands the finished list back rather than changing an existing one."},
    {t:"rule", x:"**Do not read a comprehension left to right.** Read it in three steps: **(1) the middle** — `for x in things` — what is being looped over. **(2) the end** — `if ...`, if there is one — which of them are kept. **(3) the front** — the expression — what gets made from each one that survived. The front is written first and happens last. That inversion is the entire reason they are hard to read, and a procedure beats a feel for it."},
    {t:"table", head:["in the four-line form","where it goes in the one-line form"], rows:[
      ["short = []",                 "nowhere — the square brackets are what make the list."],
      ["for bird in birds:",         "**the middle.** Read this first: `for bird in birds`."],
      ["if len(bird) == 4:",         "**the end.** Read this second: `if len(bird) == 4`."],

    {t:"rule", x:"The expression at the front can be anything, not just the item itself: `[word.upper() for word in words]` makes a list of uppercase copies, `[len(word) for word in words]` a list of lengths."},

      note:"Three comprehensions over the same list. Only the front changes."},
    {t:"warn", x:"There are two different things that both use `if`, and the position is the only clue. An `if` at **the end** is a filter — some items are left out, and the new list may be shorter. An `if ... else` at **the front** is a choice — every item produces something, and the new list is always the same length. They read almost identically and catch everyone."},
    {t:"table", head:["written","what it means"], rows:[
      ["[x for x in things if cond]",        "**a filter.** Items where cond is False are left out entirely. Shorter list."],

{
  id: "funcs", title: "Making your own verbs", minutes: 12,

  blocks: [

    {t:"warn", x:"**`return` and `print` are unrelated and this confusion is worth killing early.** `print` writes something onto the screen for a human to read. `return` hands a value back into the program so the rest of the code can use it. A function that only prints hands back `None` — so `x = greet(\"Vee\")` attaches `x` to nothing at all."},
    {t:"code", src:'def shout_print(word):\n    print(word.upper())\n\ndef shout_return(word):\n    return word.upper()\n\na = shout_print("otter")\nb = shout_return("otter")\nprint("a is:", a)\nprint("b is:", b)',

    {t:"code", src:'def count_letters(words):\n    total = []\n    for word in words:\n        total.append(len(word))\n    return total\n\nprint(count_letters(["heron", "wren"]))\nprint(total)',

{
  id: "catch", title: "Catching it", minutes: 12,
  why: "Some errors are your mistake and want fixing. Others are not yours at all - a file that is not there, a person who typed a word where a number was wanted - and for those you want the program to carry on deliberately instead of stopping.",
  known: [
    "The last line of a traceback names the kind of error and what was wrong.",
    "`int(X)` makes a whole number out of text that looks like one, and raises `ValueError` when it does not.",
    "`d[key]` looks up a dictionary key and raises `KeyError` when it is not there.",
    "`things[0]` is the first list item and raises `IndexError` when there is nothing there.",
    "`for item in things:` repeats its indented block once per item.",
    "`f\"text {name}\"` drops the value of `name` into the text, and `f\"{name!r}\"` drops in its repr.",
    "`def name(args):` makes a function; `return` hands a value back."
  ],
  blocks: [
    {t:"rule", x:"`try:` takes an indented block. `except SomeError:` takes another. If nothing goes wrong the except block is skipped entirely. If that error happens, Python abandons the rest of the try **at that point** and runs the except instead."},
    {t:"code", src:'answer = "seven"\n\ntry:\n    number = int(answer)\n    print(f"got the number {number}")\nexcept ValueError:\n    print(f"{answer!r} is not a number I can use")',
      note:'Change "seven" to "7" and run it again. Same code, the other branch.'},
    {t:"p", x:"Note where the try block stopped. The `print` on the line after `int(answer)` never ran, because the failure happened before it. Everything from the failing line to the end of the try block is skipped."},
    {t:"rule", x:"Name the error you expect. `except ValueError:` catches a `ValueError` and nothing else — anything else still stops the program, which is what you want."},
    {t:"warn", x:"**Never write a bare `except:`.** It catches everything: your own typos, a `NameError` in a line you have not tested, the interrupt you press to stop a runaway program. It turns a clear message into silence, and a bug that would have announced itself on the first run instead hides for six months. Name what you expect. If you genuinely mean *anything*, `except Exception as e:` and then print `e` — but be sure you mean it."},
    {t:"rule", x:"`except SomeError as e:` attaches the name `e` to the error itself. `print(e)` gives you the message that would have been on the last line of the traceback."},
    {t:"code", src:'for answer in ["12", "heron"]:\n    try:\n        print(int(answer))\n    except ValueError as e:\n        print(f"could not use {answer!r} - Python said: {e}")',
      note:"The error object, caught and asked what it was about. That message is often better than anything you would have written."},
    {t:"rule", x:"You may write several `except` blocks. Python checks them top to bottom and runs the first one that matches — the same shape as `if` / `elif`, and as with that, exactly one of them runs."},
    {t:"code", src:'homes = {"otter": "river"}\n\nfor animal in ["otter", "badger"]:\n    try:\n        print(f"the {animal} lives in the {homes[animal]}")\n    except KeyError:\n        print(f"I do not know where the {animal} lives")\n    except TypeError:\n        print("that was not something I could look up at all")',
      note:"Two named errors, one try. Only the KeyError happens here; the TypeError block sits unused, which is the normal state of most except blocks."},
    {t:"table", head:["written","when it runs"], rows:[
      ["try:",     "always. Python starts here, and abandons the rest of the block the moment something goes wrong."],
      ["except E:", "only when an error of kind E happened inside the try."],
      ["else:",    "only when the try finished with nothing going wrong. Rarely needed, but clearer than putting the line inside the try."],
      ["finally:", "always, either way, at the end. For tidying up that must happen whatever happened."]
    ]},
    {t:"code", src:'for answer in ["12", "heron"]:\n    try:\n        number = int(answer)\n    except ValueError:\n        print(f"{answer!r} is not a number")\n    else:\n        print(f"{answer!r} came through as {number}")\n    finally:\n        print("- done with that one")',
      note:"All four in one shape. Read the output against the table above: the finally line appears both times, the else line only once."},
    {t:"note", x:"The judgement that matters, and it is a judgement rather than a rule: `try` / `except` is for things **outside your control** — a missing file, a network that is down, text that came from a person. It is not for your own mistakes. A `NameError` or a `TypeError` in your own code is a bug, and wrapping it in an except does not fix it, it hides it somewhere it will be much harder to find. When you can simply check first — `if key in d:` — that is usually the clearer thing to write."},
    {t:"rule", x:"`raise ValueError(\"message\")` raises one on purpose. This is how a function of yours says *you have handed me something I cannot work with*, instead of limping on and producing nonsense further down."},
    {t:"code", src:'def initial(word):\n    if word == "":\n        raise ValueError("initial() needs a word with at least one letter")\n    return word[0]\n\nprint(initial("heron"))\nprint(initial(""))',
      note:"The second call is meant to fail. Read the last line of the traceback - it is the sentence you wrote yourself, which is the whole point of raising it."},
    {t:"note", x:"Failing early and loudly, with a message that says what was wrong, is kinder to you later than carrying on quietly. Most of the worst debugging sessions of your life will be about something that did not raise when it should have."},
    {t:"ex", id:"ca1",
      prompt:"Loop over [\"12\", \"heron\", \"4\"]. For each one, try to turn it into a whole number. Print `12 is a number` when it works and `heron is not a number` when it does not. Expected output:\n\n12 is a number\nheron is not a number\n4 is a number",
      starter:'answers = ["12", "heron", "4"]\n',
      check:{ out:"12 is a number\nheron is not a number\n4 is a number",
              require:[["try\\s*:", "use a try block"], ["except\\s+ValueError", "catch ValueError by name"]],
              forbid:[["except\\s*:", "name the error you expect rather than writing a bare except:"]] },
      hints:["int(answer) is the line that may fail, so it goes inside the try.",
             "The success print goes inside the try too, after the int - it should not run when the int failed.",
             'try: / number = int(answer) / print(f"{answer} is a number") / except ValueError: / print(f"{answer} is not a number")'],
      solution:'answers = ["12", "heron", "4"]\nfor answer in answers:\n    try:\n        number = int(answer)\n        print(f"{answer} is a number")\n    except ValueError:\n        print(f"{answer} is not a number")'},
    {t:"ex", id:"ca2",
      prompt:"Using the dictionary below, look up each of \"otter\" and \"badger\" and print exactly:\n\nthe otter lives in the river\nI do not know where the badger lives\n\nCatch the error by name rather than checking first, so that the shape is the one this lesson is about.",
      starter:'homes = {"otter": "river", "heron": "reeds"}\n',
      check:{ out:"the otter lives in the river\nI do not know where the badger lives",
              require:[["try\\s*:", "use a try block"], ["except\\s+KeyError", "catch KeyError by name"]],
              forbid:[["except\\s*:", "name the error you expect rather than writing a bare except:"],
                      ["\\.get\\s*\\(", "use try / except here rather than .get() - that is the point of the exercise"]] },
      hints:["Loop over the list [\"otter\", \"badger\"].",
             "homes[animal] is the line that may raise KeyError, so the print containing it goes inside the try.",
             'except KeyError: then print(f"I do not know where the {animal} lives")'],
      solution:'homes = {"otter": "river", "heron": "reeds"}\nfor animal in ["otter", "badger"]:\n    try:\n        print(f"the {animal} lives in the {homes[animal]}")\n    except KeyError:\n        print(f"I do not know where the {animal} lives")'}
  ],
  cards: [
    {q:"What happens to the rest of a try block when something goes wrong partway through it?", a:"It is abandoned at that point. Python jumps straight to the matching except block; no later line in the try runs."},
    {q:"Why should you never write a bare `except:` ?", a:"It catches everything, including your own typos and the interrupt that stops a runaway program, and replaces a clear error message with silence. Name the error you expect."},
    {q:"What is try/except actually for?", a:"Things outside your control - a missing file, a network that is down, text typed by a person. Not your own bugs: wrapping a NameError in an except hides it rather than fixing it."},
    {q:"What is the difference between except, else and finally?", a:"except runs only when that error happened; else runs only when nothing went wrong; finally runs either way, at the end, for tidying up."},
    {q:"What does `raise ValueError(\"message\")` do, and why write one?", a:"Raises that error deliberately, so a function can refuse input it cannot work with instead of limping on and producing nonsense further down."}
  ]
},

/* ── 14 ────────────────────────────────────────────────────── */
{
  id: "files", title: "Keeping things", minutes: 10,
  why: "Everything so far vanishes the moment the program ends. A file is the smallest way to make something outlive the run.",
  known: [
    "`\"text\"` is a str. `+` joins two strs, and `f\"text {name}\"` drops a value into the text.",
    "`for item in things:` repeats its indented block once per item.",
    "`things.append(x)` adds to a list. `[a, b]` is a list.",
    "`try:` / `except SomeError:` runs the except block when that named error happens inside the try, instead of stopping.",
    "`def name(args):` makes a function; `return` hands a value back.",
    "Indentation, four spaces per level, says which lines are inside a block."
  ],
  blocks: [
    {t:"note", x:"Python here is running inside your browser tab, on a small pretend filesystem that resets when the page reloads. The code is exactly the code you would write on a real machine and it behaves exactly the same — the file just does not outlive the tab. That is fine for learning the shape of it."},
    {t:"rule", x:"`with open(\"name.txt\", \"w\") as f:` opens a file and attaches `f` to it for the indented block underneath. When the block ends the file is closed for you, even if something goes wrong. Always use the `with` form."},
    {t:"table", head:["mode","what it does"], rows:[
      ['"w"', "write. Creates the file, and **erases anything already in it**."],
      ['"a"', "append. Creates it if needed, adds to the end, keeps what was there."],
      ['"r"', "read. Raises FileNotFoundError if it is not there."]
    ]},
    {t:"code", src:'with open("birds.txt", "w") as f:\n    f.write("heron\\n")\n    f.write("wren\\n")\n\nwith open("birds.txt", "r") as f:\n    print(f.read())',
      note:'`\\n` inside text means "a new line here". f.write does not add one for you — unlike print, which always does.'},
    {t:"rule", x:"`f.read()` hands back the whole file as one piece of text. Looping — `for line in f:` — hands back one line at a time, each with its `\\n` still on the end."},
    {t:"rule", x:"`text.strip()` hands back a copy with whitespace removed from both ends, including that trailing newline. You will use it on nearly every line you read from a file."},
    {t:"code", src:'with open("birds.txt", "w") as f:\n    f.write("heron\\nwren\\ncrow\\n")\n\nnames = []\nwith open("birds.txt", "r") as f:\n    for line in f:\n        names.append(line.strip())\n\nprint(names)',
      note:"Read the file into a list, one stripped line per item. Take the .strip() off and re-run to see the newlines survive into the list."},
    {t:"warn", x:'Opening with `"w"` erases the file the instant it opens, before you have written a single thing. If you meant to add to it, you wanted `"a"`.'},
    {t:"rule", x:"Opening a file for reading that is not there raises `FileNotFoundError`. A file your program did not create is exactly the kind of thing outside your control, so this is the textbook case for `try:` / `except FileNotFoundError:`."},
    {t:"code", src:'try:\n    with open("nowhere.txt", "r") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print("that file is not there - nothing to read")',
      note:'Handled rather than stopped. Change the name to birds.txt, after running the example above that creates it, and the other branch runs instead.'},
    {t:"ex", id:"fi1",
      prompt:"Write the three lines alder, birch, willow into a file called trees.txt — one per line. Then read the file back and print each line with a \"- \" in front of it:\n\n- alder\n- birch\n- willow",
      starter:"",
      check:{ out:"- alder\n- birch\n- willow", require:[["open\\s*\\(","use open(...)"],["strip\\s*\\(","use .strip() to remove the newline"]] },
      hints:['Write with "w", then open again with "r" to read.',
             "Each line you read still has a \\n on the end — strip() it before printing.",
             'for line in f: then print(f"- {line.strip()}")'],
      solution:'with open("trees.txt", "w") as f:\n    f.write("alder\\nbirch\\nwillow\\n")\n\nwith open("trees.txt", "r") as f:\n    for line in f:\n        print(f"- {line.strip()}")'}
  ],
  cards: [
    {q:"Why use `with open(...) as f:` rather than plain open()?", a:"The file is closed automatically when the indented block ends, even if an error is raised inside it."},
    {q:"What is the danger of opening a file with mode \"w\"?", a:"It erases the existing contents immediately on opening. Use \"a\" to add to the end instead."},
    {q:"Why does nearly every line read from a file get .strip() called on it?", a:"Lines come back with their trailing newline attached. strip() removes whitespace from both ends, newline included."}
  ]
},
